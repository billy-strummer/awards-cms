<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1520"/>
      <stop offset="50%" style="stop-color:#12202e"/>
      <stop offset="100%" style="stop-color:#1a2d3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Circuit lines -->
  <g fill="none" stroke="rgba(201,162,39,0.15)" stroke-width="2">
    <line x1="0" y1="150" x2="200" y2="150"/><line x1="200" y1="150" x2="200" y2="100"/><line x1="200" y1="100" x2="400" y2="100"/>
    <line x1="400" y1="100" x2="400" y2="200"/><line x1="400" y1="200" x2="600" y2="200"/><line x1="600" y1="200" x2="600" y2="150"/><line x1="600" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="150" y2="300"/><line x1="150" y1="300" x2="150" y2="450"/><line x1="150" y1="450" x2="300" y2="450"/>
    <line x1="300" y1="450" x2="300" y2="350"/><line x1="300" y1="350" x2="500" y2="350"/><line x1="500" y1="350" x2="500" y2="480"/><line x1="500" y1="480" x2="800" y2="480"/>
    <line x1="650" y1="100" x2="650" y2="350"/><line x1="650" y1="350" x2="750" y2="350"/><line x1="750" y1="350" x2="750" y2="480"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="rgba(201,162,39,0.35)">
    <circle cx="200" cy="150" r="5"/><circle cx="400" cy="100" r="5"/><circle cx="600" cy="200" r="5"/>
    <circle cx="150" cy="300" r="5"/><circle cx="300" cy="450" r="5"/><circle cx="500" cy="350" r="5"/>
    <circle cx="650" cy="150" r="5"/><circle cx="750" cy="350" r="5"/>
  </g>
  <!-- Wrench icon -->
  <g fill="none" stroke="rgba(201,162,39,0.4)" stroke-width="10" stroke-linecap="round">
    <path d="M320 220 L480 380"/>
    <circle cx="300" cy="200" r="40" fill="none"/>
    <circle cx="500" cy="400" r="30" fill="none"/>
    <path d="M270 170 Q300 160 330 190" stroke-width="8"/>
  </g>
  <!-- Lightning bolt -->
  <polygon points="380,180 360,290 395,290 370,400 415,280 378,280 400,180" fill="rgba(201,162,39,0.25)"/>
</svg>

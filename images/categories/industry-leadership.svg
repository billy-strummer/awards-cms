<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12100a"/>
      <stop offset="50%" style="stop-color:#1c1808"/>
      <stop offset="100%" style="stop-color:#231d0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(201,162,39,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(201,162,39,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="280" r="300" fill="url(#glow)"/>
  <!-- Radiating lines -->
  <g stroke="rgba(201,162,39,0.1)" stroke-width="1" fill="none">
    <line x1="400" y1="280" x2="400" y2="0"/><line x1="400" y1="280" x2="400" y2="560"/>
    <line x1="400" y1="280" x2="0" y2="280"/><line x1="400" y1="280" x2="800" y2="280"/>
    <line x1="400" y1="280" x2="180" y2="60"/><line x1="400" y1="280" x2="620" y2="60"/>
    <line x1="400" y1="280" x2="180" y2="500"/><line x1="400" y1="280" x2="620" y2="500"/>
    <line x1="400" y1="280" x2="80" y2="170"/><line x1="400" y1="280" x2="720" y2="170"/>
    <line x1="400" y1="280" x2="80" y2="390"/><line x1="400" y1="280" x2="720" y2="390"/>
  </g>
  <!-- Crown -->

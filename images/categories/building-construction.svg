<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208"/>
      <stop offset="50%" style="stop-color:#2d1f05"/>
      <stop offset="100%" style="stop-color:#3a2808"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Brick rows -->
  <g fill="none" stroke="rgba(201,162,39,0.12)" stroke-width="1">
    <!-- Row 1 -->
    <rect x="0" y="100" width="160" height="50"/><rect x="160" y="100" width="160" height="50"/><rect x="320" y="100" width="160" height="50"/><rect x="480" y="100" width="160" height="50"/><rect x="640" y="100" width="160" height="50"/>
    <!-- Row 2 offset -->
    <rect x="-80" y="150" width="160" height="50"/><rect x="80" y="150" width="160" height="50"/><rect x="240" y="150" width="160" height="50"/><rect x="400" y="150" width="160" height="50"/><rect x="560" y="150" width="160" height="50"/><rect x="720" y="150" width="160" height="50"/>
    <!-- Row 3 -->
    <rect x="0" y="200" width="160" height="50"/><rect x="160" y="200" width="160" height="50"/><rect x="320" y="200" width="160" height="50"/><rect x="480" y="200" width="160" height="50"/><rect x="640" y="200" width="160" height="50"/>
    <!-- Row 4 offset -->
    <rect x="-80" y="250" width="160" height="50"/><rect x="80" y="250" width="160" height="50"/><rect x="240" y="250" width="160" height="50"/><rect x="400" y="250" width="160" height="50"/><rect x="560" y="250" width="160" height="50"/><rect x="720" y="250" width="160" height="50"/>
    <!-- Row 5 -->
    <rect x="0" y="300" width="160" height="50"/><rect x="160" y="300" width="160" height="50"/><rect x="320" y="300" width="160" height="50"/><rect x="480" y="300" width="160" height="50"/><rect x="640" y="300" width="160" height="50"/>
    <!-- Row 6 offset -->
    <rect x="-80" y="350" width="160" height="50"/><rect x="80" y="350" width="160" height="50"/><rect x="240" y="350" width="160" height="50"/><rect x="400" y="350" width="160" height="50"/><rect x="560" y="350" width="160" height="50"/><rect x="720" y="350" width="160" height="50"/>
    <!-- Row 7 -->
    <rect x="0" y="400" width="160" height="50"/><rect x="160" y="400" width="160" height="50"/><rect x="320" y="400" width="160" height="50"/><rect x="480" y="400" width="160" height="50"/><rect x="640" y="400" width="160" height="50"/>
    <!-- Row 8 offset -->
    <rect x="-80" y="450" width="160" height="50"/><rect x="80" y="450" width="160" height="50"/><rect x="240" y="450" width="160" height="50"/><rect x="400" y="450" width="160" height="50"/><rect x="560" y="450" width="160" height="50"/><rect x="720" y="450" width="160" height="50"/>
  </g>
  <!-- Building silhouette -->
  <g fill="rgba(201,162,39,0.18)">
    <rect x="260" y="180" width="280" height="240"/>
    <rect x="200" y="260" width="400" height="160"/>
    <polygon points="260,180 400,100 540,180"/>
    <rect x="340" y="330" width="60" height="90"/>
    <rect x="290" y="230" width="50" height="50"/><rect x="460" y="230" width="50" height="50"/>
  </g>
  <rect width="800" height="600" fill="url(#fade)" opacity="0.3"/>
</svg>

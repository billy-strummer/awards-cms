<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#2a1f08" stop-opacity="1"/>
      <stop offset="45%" stop-color="#141208" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1505"/>
    </linearGradient>
    <!-- Building face gradient -->
    <linearGradient id="buildFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Building top gradient -->
    <linearGradient id="buildTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Building side gradient -->
    <linearGradient id="buildSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Steel beam gradient -->
    <linearGradient id="steelBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e8c84a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Glow filter for beams -->
    <filter id="beamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Window glow -->
    <filter id="winGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Isometric transforms defined via transform on groups -->
    <linearGradient id="craneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8c84a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="800" height="500" fill="url(#bgBase)"/>
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Background construction site glow - dusk atmosphere -->
  <ellipse cx="400" cy="400" rx="320" ry="180" fill="#C9A227" fill-opacity="0.06"/>
  <ellipse cx="400" cy="350" rx="200" ry="120" fill="#C9A227" fill-opacity="0.08"/>

  <!-- Background grid pattern (subtle) -->
  <g stroke="rgba(201,162,39,0.05)" stroke-width="1" fill="none">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- ===== ISOMETRIC BUILDING ===== -->
  <!-- The building is an isometric cube. Centre ~(380, 280).
       In isometric: face front = parallelogram, top = diamond, side = parallelogram -->

  <!-- Isometric building - FRONT FACE (main wall with bricks) -->
  <!-- Front face: top-left (220,200), top-right (460,200), bottom-right (460,400), bottom-left (220,400) -->
  <!-- Actually use proper isometric: front face parallelogram -->
  <!-- Front left wall face: -->
  <polygon points="180,320 360,220 360,400 180,500" fill="url(#buildFace)" stroke="rgba(201,162,39,0.3)" stroke-width="1"/>
  <!-- Front right wall face: -->
  <polygon points="360,220 540,320 540,500 360,400" fill="url(#buildSide)" stroke="rgba(201,162,39,0.25)" stroke-width="1"/>
  <!-- Top face: -->
  <polygon points="180,320 360,220 540,320 360,420" fill="url(#buildTop)" stroke="rgba(201,162,39,0.45)" stroke-width="1.5"/>

  <!-- Brick pattern on front-left face -->
  <!-- Row 1 of bricks -->
  <g fill="none" stroke="rgba(201,162,39,0.2)" stroke-width="0.8">
    <!-- Horizontal mortar lines - left face (skewed) -->
    <line x1="182" y1="350" x2="358" y2="270"/>
    <line x1="182" y1="375" x2="358" y2="295"/>
    <line x1="182" y1="400" x2="358" y2="320"/>
    <line x1="182" y1="425" x2="358" y2="345"/>
    <line x1="182" y1="450" x2="358" y2="370"/>
    <line x1="182" y1="475" x2="358" y2="395"/>
    <!-- Vertical mortar lines on left face -->
    <line x1="225" y1="224" x2="225" y2="498"/>
    <line x1="270" y1="222" x2="270" y2="498"/>
    <line x1="315" y1="221" x2="315" y2="498"/>
    <line x1="247" y1="223" x2="247" y2="498"/>
    <line x1="292" y1="222" x2="292" y2="498"/>
    <line x1="337" y1="221" x2="337" y2="498"/>
  </g>

  <!-- Brick pattern on front-right face (mirrored) -->
  <g fill="none" stroke="rgba(201,162,39,0.15)" stroke-width="0.8">
    <line x1="362" y1="270" x2="538" y2="350"/>
    <line x1="362" y1="295" x2="538" y2="375"/>
    <line x1="362" y1="320" x2="538" y2="400"/>
    <line x1="362" y1="345" x2="538" y2="425"/>
    <line x1="362" y1="370" x2="538" y2="450"/>
    <line x1="362" y1="395" x2="538" y2="475"/>
    <line x1="405" y1="234" x2="405" y2="498"/>
    <line x1="450" y1="256" x2="450" y2="498"/>
    <line x1="495" y1="278" x2="495" y2="498"/>
    <line x1="427" y1="245" x2="427" y2="498"/>
    <line x1="472" y1="267" x2="472" y2="498"/>
    <line x1="517" y1="289" x2="517" y2="498"/>
  </g>

  <!-- Window openings - left face (4 windows, 2 rows) -->
  <g fill="rgba(201,162,39,0.35)" filter="url(#winGlow)">
    <!-- Row 1 windows -->
    <polygon points="210,268 240,254 240,284 210,298"/>
    <polygon points="255,250 285,236 285,266 255,280"/>
    <polygon points="300,232 330,218 330,248 300,262"/>
    <!-- Row 2 windows -->
    <polygon points="210,318 240,304 240,334 210,348"/>
    <polygon points="255,300 285,286 285,316 255,330"/>
    <polygon points="300,282 330,268 330,298 300,312"/>
    <!-- Row 3 windows -->
    <polygon points="210,368 240,354 240,384 210,398"/>
    <polygon points="255,350 285,336 285,366 255,380"/>
    <polygon points="300,332 330,318 330,348 300,362"/>
  </g>

  <!-- Window openings - right face -->
  <g fill="rgba(201,162,39,0.2)" filter="url(#winGlow)">
    <polygon points="380,258 410,272 410,302 380,288"/>
    <polygon points="425,280 455,294 455,324 425,310"/>
    <polygon points="470,302 500,316 500,346 470,332"/>
    <polygon points="380,308 410,322 410,352 380,338"/>
    <polygon points="425,330 455,344 455,374 425,360"/>
    <polygon points="470,352 500,366 500,396 470,382"/>
    <polygon points="380,358 410,372 410,402 380,388"/>
    <polygon points="425,380 455,394 455,424 425,410"/>
    <polygon points="470,402 500,416 500,446 470,432"/>
  </g>

  <!-- ===== SCAFFOLDING (left side) ===== -->
  <g stroke="url(#steelBeam)" stroke-width="3" fill="none" filter="url(#beamGlow)">
    <!-- Vertical poles -->
    <line x1="145" y1="200" x2="145" y2="500"/>
    <line x1="170" y1="190" x2="170" y2="500"/>
    <!-- Horizontal platforms -->
    <line x1="138" y1="250" x2="178" y2="235"/>
    <line x1="138" y1="300" x2="178" y2="285"/>
    <line x1="138" y1="350" x2="178" y2="335"/>
    <line x1="138" y1="400" x2="178" y2="385"/>
    <line x1="138" y1="450" x2="178" y2="435"/>
    <!-- Diagonal bracing -->
    <line x1="145" y1="250" x2="170" y2="285"/>
    <line x1="170" y1="285" x2="145" y2="300"/>
    <line x1="145" y1="350" x2="170" y2="385"/>
    <line x1="170" y1="385" x2="145" y2="400"/>
  </g>
  <!-- Scaffolding platform boards -->
  <g fill="rgba(201,162,39,0.2)" stroke="rgba(201,162,39,0.4)" stroke-width="1">
    <rect x="138" y="247" width="42" height="5" transform="rotate(-6,159,250)"/>
    <rect x="138" y="297" width="42" height="5" transform="rotate(-6,159,300)"/>
    <rect x="138" y="347" width="42" height="5" transform="rotate(-6,159,350)"/>
    <rect x="138" y="397" width="42" height="5" transform="rotate(-6,159,400)"/>
  </g>

  <!-- ===== CRANE ===== -->
  <!-- Crane tower (vertical) -->
  <rect x="545" y="80" width="12" height="280" fill="url(#craneGrad)" filter="url(#beamGlow)"/>
  <!-- Crane lattice detail -->
  <g stroke="rgba(201,162,39,0.5)" stroke-width="1.5" fill="none">
    <line x1="545" y1="110" x2="557" y2="130"/>
    <line x1="557" y1="110" x2="545" y2="130"/>
    <line x1="545" y1="150" x2="557" y2="170"/>
    <line x1="557" y1="150" x2="545" y2="170"/>
    <line x1="545" y1="190" x2="557" y2="210"/>
    <line x1="557" y1="190" x2="545" y2="210"/>
    <line x1="545" y1="230" x2="557" y2="250"/>
    <line x1="557" y1="230" x2="545" y2="250"/>
    <line x1="545" y1="270" x2="557" y2="290"/>
    <line x1="557" y1="270" x2="545" y2="290"/>
    <line x1="545" y1="310" x2="557" y2="330"/>
    <line x1="557" y1="310" x2="545" y2="330"/>
  </g>
  <!-- Crane jib (horizontal arm) -->
  <rect x="430" y="75" width="200" height="10" fill="url(#craneGrad)" filter="url(#beamGlow)"/>
  <!-- Crane counterweight arm -->
  <rect x="557" y="75" width="80" height="8" fill="rgba(201,162,39,0.7)"/>
  <rect x="625" y="68" width="20" height="24" fill="rgba(201,162,39,0.5)"/>
  <!-- Crane hook/cable -->
  <line x1="480" y1="85" x2="480" y2="200" stroke="rgba(201,162,39,0.8)" stroke-width="2.5"/>
  <line x1="460" y1="200" x2="500" y2="200" stroke="rgba(201,162,39,0.8)" stroke-width="2.5"/>
  <path d="M470,200 Q480,225 490,200" fill="none" stroke="rgba(201,162,39,0.8)" stroke-width="2.5"/>
  <!-- Trolley on jib -->
  <rect x="470" y="73" width="20" height="14" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.7)" stroke-width="1"/>

  <!-- ===== STEEL FRAME SKELETON (top unfinished floors) ===== -->
  <g stroke="rgba(201,162,39,0.6)" stroke-width="3.5" fill="none" filter="url(#beamGlow)">
    <!-- Horizontal beams top floor -->
    <line x1="180" y1="220" x2="360" y2="120"/>
    <line x1="360" y1="120" x2="540" y2="220"/>
    <!-- Vertical columns -->
    <line x1="220" y1="195" x2="220" y2="320"/>
    <line x1="270" y1="168" x2="270" y2="320"/>
    <line x1="320" y1="143" x2="320" y2="320"/>
    <line x1="405" y1="143" x2="405" y2="320"/>
    <line x1="455" y1="168" x2="455" y2="320"/>
    <line x1="505" y1="193" x2="505" y2="320"/>
    <!-- Floor level beam at mid -->
    <line x1="180" y1="270" x2="360" y2="170"/>
    <line x1="360" y1="170" x2="540" y2="270"/>
  </g>

  <!-- Ground shadow/base -->
  <ellipse cx="360" cy="498" rx="200" ry="18" fill="rgba(0,0,0,0.5)"/>
  <rect x="100" y="490" width="560" height="10" fill="url(#groundGrad)" rx="2"/>

  <!-- Construction material stacks at base -->
  <g fill="rgba(201,162,39,0.25)" stroke="rgba(201,162,39,0.4)" stroke-width="1">
    <!-- Steel beam stack left -->
    <rect x="108" y="470" width="55" height="6" rx="1"/>
    <rect x="110" y="463" width="55" height="6" rx="1"/>
    <rect x="112" y="456" width="55" height="6" rx="1"/>
    <rect x="114" y="449" width="55" height="6" rx="1"/>
    <!-- Blocks right -->
    <rect x="580" y="465" width="30" height="20" rx="1"/>
    <rect x="615" y="468" width="30" height="17" rx="1"/>
    <rect x="648" y="472" width="25" height="13" rx="1"/>
  </g>

  <!-- Dust/atmosphere particles -->
  <g fill="rgba(201,162,39,0.15)">
    <circle cx="120" cy="180" r="2"/>
    <circle cx="680" cy="150" r="1.5"/>
    <circle cx="200" cy="120" r="1"/>
    <circle cx="600" cy="180" r="2"/>
    <circle cx="150" cy="420" r="1.5"/>
    <circle cx="700" cy="380" r="1"/>
  </g>

  <!-- Atmospheric vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#vignette)"/>
</svg>

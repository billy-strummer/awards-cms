<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winners - British Trade Awards</title>
  <link rel="icon" href="BTA_Corporate_Horizontal-Texture.png" type="image/png">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Open Graph -->
  <meta property="og:title" content="Winners - British Trade Awards">
  <meta property="og:description" content="Congratulations to all winners of the British Trade Awards">
  <meta property="og:type" content="website">
  <meta property="og:image" content="BTA_Corporate_Horizontal-Texture.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Celebrating excellence in the British trades — meet our award winners.">

  <style>
    :root {
      --gold: #C9A227;
      --gold-dark: #a8863a;
      --dark: #1a1a2e;
      --dark-mid: #16213e;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--dark);
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f0f0f0;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      top: 0;
      width: 50%;
      height: 100%;
      background-image: url('BTA_Corporate_Horizontal-Black-and-White-01.png');
      background-size: contain;
      background-repeat: no-repeat;
      opacity: 0.04;
      z-index: 0;
      pointer-events: none;
    }
    body::before { left: -10%; background-position: right center; }
    body::after  { right: -10%; background-position: left center; }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* Hero header */
    .winners-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .winners-header .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 16px;
      border: 2px solid var(--gold);
      margin-bottom: 20px;
      background: white;
      padding: 6px;
    }

    .winners-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .winners-header p {
      color: #adb5bd;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .gold-divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 16px auto;
      border-radius: 2px;
    }

    /* Category sections */
    .category-section {
      margin-bottom: 44px;
    }

    .category-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      color: var(--gold);
      border-bottom: 2px solid rgba(201, 168, 76, 0.3);
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title i {
      font-size: 1rem;
      opacity: 0.7;
    }

    /* Winner cards */
    .winner-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .winner-card:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(255,255,255,0.08);
    }

    .winner-card.winner-first {
      border-color: var(--gold);
      background: rgba(201,168,76,0.07);
    }

    .org-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 10px;
      background: white;
      padding: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .org-logo-placeholder {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: rgba(255,255,255,0.3);
      font-size: 1.5rem;
    }

    .winner-info {
      flex: 1;
      min-width: 0;
    }

    .winner-info .company-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .winner-info .award-label {
      font-size: 0.82rem;
      color: #adb5bd;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .placement-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-winner {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #1a1a2e;
    }

    .badge-runner-up {
      background: rgba(156,163,175,0.2);
      color: #d1d5db;
      border: 1px solid rgba(156,163,175,0.4);
    }

    .badge-commended {
      background: rgba(96,165,250,0.15);
      color: #93c5fd;
      border: 1px solid rgba(96,165,250,0.3);
    }

    /* Share buttons */
    .share-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .share-btn {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }
    .share-btn:hover { opacity: 0.85; }

    .share-btn-twitter  { background: #000; color: #fff; }
    .share-btn-linkedin { background: #0077b5; color: #fff; }

    /* Loading / Error */
    .loading-state {
      text-align: center;
      padding: 80px 0;
      color: #adb5bd;
    }

    .loading-state .spinner-border {
      color: var(--gold);
      width: 3rem;
      height: 3rem;
    }

    .error-state {
      text-align: center;
      padding: 60px 20px;
      color: #f87171;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #adb5bd;
    }

    /* Footer */
    .winners-footer {
      text-align: center;
      padding: 30px 0 10px;
      color: #4b5563;
      font-size: 0.82rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 40px;
    }

    .winners-footer a {
      color: var(--gold);
      text-decoration: none;
    }

    @media (max-width: 576px) {
      .winners-header h1 { font-size: 1.8rem; }
      .winner-card { flex-wrap: wrap; }
      .share-row { display: none; }
    }

    @media (max-width: 480px) {
      .winners-grid { grid-template-columns: 1fr !important; }
      .winner-card { padding: 1rem; }
      .filter-row { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- Header -->
    <div class="winners-header">
      <img src="BTA_Corporate_Horizontal-Texture.png" alt="British Trade Awards" class="logo">
      <h1>Award Winners</h1>
      <div class="gold-divider"></div>
      <p id="winnersSubtitle">Celebrating excellence in British trade and business</p>
    </div>

    <!-- Main content -->
    <div id="winnersContent">
      <div class="loading-state">
        <div class="spinner-border mb-3" role="status">
          <span class="visually-hidden">Loading winners...</span>
        </div>
        <p class="mt-2">Loading winners...</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="winners-footer">
      <p class="mb-1">
        <i class="bi bi-award me-1" style="color: var(--gold);"></i>
        Powered by <strong>British Trade Awards</strong>
      </p>
      <p class="mb-0">
        <a href="https://www.britishtradeawards.com" target="_blank" rel="noopener noreferrer">britishtradeawards.com</a>
      </p>
    </div>

  </div>

  <script src="public-utils.js"></script>
  <script src="public-winners-app.js"></script>
</body>
</html>

name: CI/CD Pipeline

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          echo "Checking frontend JS syntax..."
          for f in *.js; do
            node -c "$f" || exit 1
          done
          echo "All frontend files pass syntax check"

      - name: Validate API JS syntax
        working-directory: ./api
        run: |
          for f in *.js; do
            node -c "$f" || exit 1
          done
          echo "All API files pass syntax check"

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check JavaScript (JSDoc)
        run: npm run typecheck
        continue-on-error: true

      - name: Run tests with coverage
        run: npx jest tests/ --ci --coverage --forceExit --coverageReporters=text-summary,json-summary
        env:
          NODE_ENV: test

      - name: Report coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            echo "Line coverage: ${LINES}%"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          FOUND=$(grep -rn -E "(password|secret|apiKey|api_key|token)\s*=\s*['\"][^'\"]{8,}" \
            --include="*.js" --include="*.html" \
            --exclude="config.js" --exclude-dir=node_modules --exclude-dir=.git . || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: Possible hardcoded secrets found:"
            echo "$FOUND"
          fi

      - name: Check for .env files committed
        run: |
          if [ -f .env ] || [ -f api/.env ]; then
            echo "ERROR: .env file should not be committed!"
            exit 1
          fi

      - name: Audit API dependencies
        working-directory: ./api
        run: npm audit --production --audit-level=high || true

  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: npm ci

      - name: Bundle JavaScript
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - British Trade Awards</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/logos/non-stacked/BTA_Corporate_Horizontal-Texture.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-color: #C9A227;
      --gold-light: #e0b93a;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; }
    .success-card { max-width: 520px; text-align: center; }
    .success-icon { font-size: 4rem; color: #28a745; }
    h1 { font-family: 'Playfair Display', Georgia, serif; }
    .btn-gold { background: var(--gold-color); color: #000; border: none; font-weight: 600; }
    .btn-gold:hover { background: var(--gold-light); color: #000; }
    @media (max-width: 480px) {
      .success-card { margin: 8px; padding: 1.5rem 1rem !important; }
    }
      .card { background: #1a1a1a !important; border: 1px solid rgba(201,162,39,0.2) !important; color: #ffffff !important; }
    .text-muted { color: rgba(255,255,255,0.5) !important; }
    h1 { color: #ffffff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card success-card mx-auto shadow-sm p-5">
      <div class="success-icon mb-3"><i class="bi bi-check-circle-fill" aria-hidden="true"></i></div>
      <div aria-live="polite">
        <h1 class="h3 mb-3">Confirming Your Payment…</h1>
        <p class="text-muted mb-4">Please wait while we confirm your payment. You will receive a confirmation email shortly.</p>
      </div>
      <div id="entryInfo" class="mb-4"></div>
      <a href="/" class="btn btn-gold px-4">Return to My Entry Dashboard</a>
    </div>
  </div>
  <!-- Footer -->
  <footer style="background:#050505;border-top:1px solid #1a1a1a;padding:40px 0 28px;margin-top:48px;width:100%;">
    <div class="container">
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;">
        <a href="home.html" style="font-size:0.8rem;color:rgba(255,255,255,0.35);padding:5px 12px;border-radius:100px;text-decoration:none;transition:color 0.2s;">Home</a>
        <a href="submit-entry.html" style="font-size:0.8rem;color:#C9A227;padding:5px 12px;border-radius:100px;text-decoration:none;">Enter 2026</a>
        <a href="privacy-policy.html" style="font-size:0.8rem;color:rgba(255,255,255,0.35);padding:5px 12px;border-radius:100px;text-decoration:none;">Privacy Policy</a>
        <a href="terms-and-conditions.html" style="font-size:0.8rem;color:rgba(255,255,255,0.35);padding:5px 12px;border-radius:100px;text-decoration:none;">Terms &amp; Conditions</a>
        <a href="mailto:info@britishtradeawards.com" style="font-size:0.8rem;color:rgba(255,255,255,0.35);padding:5px 12px;border-radius:100px;text-decoration:none;">Contact</a>
      </div>
      <p style="font-size:0.75rem;color:rgba(255,255,255,0.18);text-align:center;margin:0;">&copy; 2026 British Trade Awards. All rights reserved.</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import './config.js';
    (async function() {
      // Wait for config to be available
      let retries = 0;
      while (!window.SUPABASE_CONFIG && retries < 20) {
        await new Promise(r => setTimeout(r, 100));
        retries++;
      }

      const params = new URLSearchParams(window.location.search);
      const entryId = params.get('entry');
      const sessionId = params.get('session_id');
      const card = document.querySelector('.success-card');
      const infoEl = document.getElementById('entryInfo');

      // Verify payment actually occurred via Stripe session or DB record
      if ((sessionId || entryId) && window.SUPABASE_CONFIG) {
        try {
          const supabase = window.supabase.createClient(
            window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey
          );
          // Check if a payment record exists for this entry
          if (entryId) {
            const { data: payment } = await supabase
              .from('payments')
              .select('id, payment_reference, amount')
              .eq('entry_id', entryId)
              .order('created_at', { ascending: false })
              .limit(1)
              .single();
            if (payment) {
              const safeRef = document.createTextNode(payment.payment_reference || (entryId ? entryId.substring(0, 8) : ''));
              const p = document.createElement('p');
              p.className = 'small text-muted';
              p.innerHTML = 'Payment reference: <strong></strong>';
              p.querySelector('strong').appendChild(safeRef);
              infoEl.appendChild(p);
              const nextSteps = document.createElement('div');
              nextSteps.innerHTML = `<p class="mt-3" style="font-size:0.85rem; color:rgba(0,0,0,0.5);">A confirmation email has been sent with your entry details and receipt.</p><p style="font-size:0.85rem; color:rgba(0,0,0,0.5);">Our team will review your entry and contact you with next steps.</p>`;
              infoEl.appendChild(nextSteps);
              // Update heading to confirmed success state
              const liveRegion = card.querySelector('[aria-live]');
              liveRegion.querySelector('h1').textContent = 'Payment Successful';
              liveRegion.querySelector('p').textContent = 'Thank you! Your payment has been processed successfully.';
            } else {
              // No verified payment found - show warning
              card.querySelector('.success-icon').innerHTML = '<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>';
              card.querySelector('.success-icon').style.color = '#ffc107';
              const liveRegion = card.querySelector('[aria-live]');
              liveRegion.querySelector('h1').textContent = 'Payment Pending';
              liveRegion.querySelector('p').textContent = 'Your payment is being processed. If you are not redirected, please contact support.';
            }
          }
        } catch (e) {
          // Graceful fallback
          if (entryId) {
            const safeRef = document.createTextNode(entryId ? entryId.substring(0, 8) : '');
            const p = document.createElement('p');
            p.className = 'small text-muted';
            p.innerHTML = 'Entry reference: <strong></strong>';
            p.querySelector('strong').appendChild(safeRef);
            infoEl.appendChild(p);
          }
        }
      }
    })();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bc-bgGlow" cx="55%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a1f06"/>
      <stop offset="40%" stop-color="#15120a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="bc-bgBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0d0b"/>
      <stop offset="100%" stop-color="#1c1505"/>
    </linearGradient>
    <radialGradient id="bc-siteGlow" cx="50%" cy="88%" r="55%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.2)"/>
      <stop offset="70%" stop-color="rgba(201,162,39,0.04)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <linearGradient id="bc-faceFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="bc-faceSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.07)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.16)"/>
    </linearGradient>
    <linearGradient id="bc-faceTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.3)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.12)"/>
    </linearGradient>
    <linearGradient id="bc-steelBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8a6a1a"/>
    </linearGradient>
    <linearGradient id="bc-craneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#e8c84a"/>
    </linearGradient>
    <radialGradient id="bc-winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,220,120,0.95)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.35)"/>
    </radialGradient>
    <filter id="bc-beamGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bc-winFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bc-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bc-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <linearGradient id="bc-groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.18)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.02)"/>
    </linearGradient>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="800" height="500" fill="url(#bc-bgBase)"/>
  <rect width="800" height="500" fill="url(#bc-bgGlow)"/>
  <rect width="800" height="500" fill="url(#bc-siteGlow)"/>

  <!-- Background grid (faint) -->
  <g stroke="rgba(201,162,39,0.04)" stroke-width="1" fill="none">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="80" y1="0" x2="80" y2="500"/><line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>

  <!-- Atmosphere haze at horizon -->
  <ellipse cx="360" cy="410" rx="330" ry="160" fill="rgba(201,162,39,0.06)" filter="url(#bc-softGlow)"/>

  <!-- ===== DISTANT CITY SILHOUETTE ===== -->
  <g fill="rgba(12,10,5,0.85)">
    <rect x="25" y="270" width="22" height="90"/>
    <rect x="52" y="252" width="18" height="108"/>
    <rect x="74" y="262" width="28" height="98"/>
    <rect x="107" y="245" width="16" height="115"/>
    <rect x="128" y="235" width="32" height="125"/>
    <rect x="164" y="258" width="20" height="102"/>
    <rect x="590" y="262" width="24" height="98"/>
    <rect x="619" y="240" width="20" height="120"/>
    <rect x="644" y="252" width="30" height="108"/>
    <rect x="679" y="265" width="18" height="95"/>
    <rect x="702" y="245" width="36" height="115"/>
    <rect x="742" y="268" width="22" height="92"/>
    <rect x="770" y="255" width="28" height="105"/>
  </g>
  <!-- Lit windows in distant buildings -->
  <g fill="rgba(255,200,80,0.22)">
    <rect x="28" y="278" width="5" height="7"/><rect x="36" y="278" width="5" height="7"/>
    <rect x="28" y="292" width="5" height="7"/><rect x="36" y="292" width="5" height="7"/>
    <rect x="56" y="260" width="4" height="6"/><rect x="63" y="268" width="4" height="6"/>
    <rect x="56" y="278" width="4" height="6"/>
    <rect x="133" y="244" width="5" height="7"/><rect x="142" y="244" width="5" height="7"/>
    <rect x="133" y="258" width="5" height="7"/>
    <rect x="594" y="270" width="5" height="7"/><rect x="603" y="278" width="5" height="7"/>
    <rect x="624" y="248" width="4" height="6"/><rect x="632" y="255" width="4" height="6"/>
    <rect x="648" y="260" width="5" height="7"/><rect x="657" y="268" width="5" height="7"/>
    <rect x="706" y="252" width="5" height="7"/><rect x="715" y="260" width="5" height="7"/>
    <rect x="706" y="270" width="5" height="7"/>
  </g>

  <!-- ===== ISOMETRIC BUILDING ===== -->
  <!-- Shadow under building -->
  <ellipse cx="360" cy="488" rx="185" ry="14" fill="rgba(0,0,0,0.5)"/>

  <!-- Building left face -->
  <polygon points="185,320 360,222 360,420 185,500" fill="url(#bc-faceFront)" stroke="rgba(201,162,39,0.32)" stroke-width="1.2"/>
  <!-- Building right face (side) -->
  <polygon points="360,222 535,320 535,500 360,420" fill="url(#bc-faceSide)" stroke="rgba(201,162,39,0.22)" stroke-width="1.2"/>
  <!-- Building top face -->
  <polygon points="185,320 360,222 535,320 360,418" fill="url(#bc-faceTop)" stroke="rgba(201,162,39,0.5)" stroke-width="1.5"/>

  <!-- Top face grid detail -->
  <g stroke="rgba(201,162,39,0.18)" stroke-width="0.7" fill="none">
    <line x1="272" y1="271" x2="447" y2="369"/>
    <line x1="316" y1="247" x2="491" y2="345"/>
    <line x1="230" y1="295" x2="403" y2="393"/>
    <line x1="280" y1="321" x2="360" y2="222"/>
    <line x1="360" y1="222" x2="440" y2="321"/>
    <line x1="185" y1="320" x2="360" y2="418"/>
    <line x1="535" y1="320" x2="360" y2="418"/>
  </g>

  <!-- Brick pattern - LEFT FACE horizontal mortar lines -->
  <g fill="none" stroke="rgba(201,162,39,0.18)" stroke-width="0.7">
    <line x1="187" y1="348" x2="358" y2="270"/>
    <line x1="187" y1="374" x2="358" y2="296"/>
    <line x1="187" y1="400" x2="358" y2="322"/>
    <line x1="187" y1="426" x2="358" y2="348"/>
    <line x1="187" y1="452" x2="358" y2="374"/>
    <line x1="187" y1="478" x2="358" y2="400"/>
    <!-- Vertical brick lines - left face -->
    <line x1="228" y1="226" x2="228" y2="500"/>
    <line x1="272" y1="224" x2="272" y2="500"/>
    <line x1="316" y1="223" x2="316" y2="500"/>
    <line x1="250" y1="225" x2="250" y2="500"/>
    <line x1="294" y1="223" x2="294" y2="500"/>
    <line x1="338" y1="222" x2="338" y2="500"/>
  </g>

  <!-- Brick pattern - RIGHT FACE horizontal mortar lines -->
  <g fill="none" stroke="rgba(201,162,39,0.13)" stroke-width="0.7">
    <line x1="362" y1="270" x2="533" y2="348"/>
    <line x1="362" y1="296" x2="533" y2="374"/>
    <line x1="362" y1="322" x2="533" y2="400"/>
    <line x1="362" y1="348" x2="533" y2="426"/>
    <line x1="362" y1="374" x2="533" y2="452"/>
    <line x1="362" y1="400" x2="533" y2="478"/>
    <!-- Vertical brick lines - right face -->
    <line x1="403" y1="238" x2="403" y2="500"/>
    <line x1="447" y1="260" x2="447" y2="500"/>
    <line x1="491" y1="282" x2="491" y2="500"/>
    <line x1="425" y1="249" x2="425" y2="500"/>
    <line x1="469" y1="271" x2="469" y2="500"/>
    <line x1="513" y1="293" x2="513" y2="500"/>
  </g>

  <!-- Windows LEFT face - glowing gold -->
  <g filter="url(#bc-winFilter)">
    <polygon points="212,272 242,258 242,290 212,304" fill="rgba(255,210,100,0.85)"/>
    <polygon points="258,254 288,240 288,272 258,286" fill="rgba(255,210,100,0.85)"/>
    <polygon points="304,236 334,222 334,254 304,268" fill="rgba(255,200,90,0.7)"/>
    <polygon points="212,322 242,308 242,340 212,354" fill="rgba(255,210,100,0.9)"/>
    <polygon points="258,304 288,290 288,322 258,336" fill="rgba(255,200,90,0.8)"/>
    <polygon points="304,286 334,272 334,304 304,318" fill="rgba(255,210,100,0.85)"/>
    <polygon points="212,372 242,358 242,390 212,404" fill="rgba(201,162,39,0.45)"/>
    <polygon points="258,354 288,340 288,372 258,386" fill="rgba(255,200,90,0.6)"/>
    <polygon points="304,336 334,322 334,354 304,368" fill="rgba(201,162,39,0.35)"/>
  </g>
  <!-- Window frame details - left -->
  <g stroke="rgba(255,240,160,0.6)" stroke-width="0.8" fill="none">
    <line x1="227" y1="258" x2="227" y2="304"/><line x1="212" y1="281" x2="242" y2="274"/>
    <line x1="273" y1="240" x2="273" y2="286"/><line x1="258" y1="263" x2="288" y2="256"/>
    <line x1="319" y1="222" x2="319" y2="268"/><line x1="304" y1="245" x2="334" y2="238"/>
  </g>

  <!-- Windows RIGHT face - slightly dimmer -->
  <g filter="url(#bc-winFilter)">
    <polygon points="383,262 413,276 413,308 383,294" fill="rgba(255,210,100,0.6)"/>
    <polygon points="428,284 458,298 458,330 428,316" fill="rgba(255,200,90,0.55)"/>
    <polygon points="473,306 503,320 503,352 473,338" fill="rgba(201,162,39,0.4)"/>
    <polygon points="383,312 413,326 413,358 383,344" fill="rgba(255,200,90,0.6)"/>
    <polygon points="428,334 458,348 458,380 428,366" fill="rgba(201,162,39,0.45)"/>
    <polygon points="473,356 503,370 503,402 473,388" fill="rgba(255,210,100,0.5)"/>
    <polygon points="383,362 413,376 413,408 383,394" fill="rgba(201,162,39,0.3)"/>
    <polygon points="428,384 458,398 458,430 428,416" fill="rgba(201,162,39,0.3)"/>
    <polygon points="473,406 503,420 503,452 473,438" fill="rgba(201,162,39,0.25)"/>
  </g>

  <!-- ===== SCAFFOLDING (left side of building) ===== -->
  <g stroke="url(#bc-steelBeam)" stroke-width="3.5" fill="none" filter="url(#bc-beamGlow)">
    <line x1="148" y1="205" x2="148" y2="500"/>
    <line x1="174" y1="193" x2="174" y2="500"/>
  </g>
  <!-- Scaffold platforms (boards) -->
  <g fill="rgba(201,162,39,0.22)" stroke="rgba(201,162,39,0.5)" stroke-width="1">
    <rect x="140" y="248" width="42" height="7" transform="rotate(-7,161,252)"/>
    <rect x="140" y="298" width="42" height="7" transform="rotate(-7,161,302)"/>
    <rect x="140" y="348" width="42" height="7" transform="rotate(-7,161,352)"/>
    <rect x="140" y="398" width="42" height="7" transform="rotate(-7,161,402)"/>
    <rect x="140" y="448" width="42" height="7" transform="rotate(-7,161,452)"/>
  </g>
  <!-- Scaffold diagonal bracing -->
  <g stroke="rgba(201,162,39,0.38)" stroke-width="1.5" fill="none">
    <line x1="148" y1="255" x2="174" y2="295"/>
    <line x1="174" y1="255" x2="148" y2="295"/>
    <line x1="148" y1="305" x2="174" y2="345"/>
    <line x1="174" y1="305" x2="148" y2="345"/>
    <line x1="148" y1="355" x2="174" y2="395"/>
    <line x1="174" y1="355" x2="148" y2="395"/>
    <line x1="148" y1="405" x2="174" y2="445"/>
    <line x1="174" y1="405" x2="148" y2="445"/>
  </g>

  <!-- ===== STEEL FRAME SKELETON (top unfinished section) ===== -->
  <g stroke="rgba(201,162,39,0.65)" stroke-width="3.5" fill="none" filter="url(#bc-beamGlow)">
    <!-- Ridge beam top -->
    <line x1="185" y1="222" x2="360" y2="124"/>
    <line x1="360" y1="124" x2="535" y2="222"/>
    <!-- Floor beam one level down -->
    <line x1="185" y1="272" x2="360" y2="174"/>
    <line x1="360" y1="174" x2="535" y2="272"/>
    <!-- Vertical columns -->
    <line x1="228" y1="200" x2="228" y2="320"/>
    <line x1="294" y1="173" x2="294" y2="320"/>
    <line x1="360" y1="150" x2="360" y2="320"/>
    <line x1="426" y1="173" x2="426" y2="320"/>
    <line x1="492" y1="200" x2="492" y2="320"/>
  </g>
  <!-- Cross-bracing in skeleton -->
  <g stroke="rgba(201,162,39,0.35)" stroke-width="1.5" fill="none">
    <line x1="228" y1="200" x2="294" y2="272"/>
    <line x1="294" y1="200" x2="228" y2="272"/>
    <line x1="294" y1="173" x2="360" y2="222"/>
    <line x1="360" y1="173" x2="294" y2="222"/>
    <line x1="360" y1="150" x2="426" y2="222"/>
    <line x1="426" y1="150" x2="360" y2="222"/>
    <line x1="426" y1="173" x2="492" y2="222"/>
    <line x1="492" y1="173" x2="426" y2="222"/>
  </g>

  <!-- ===== CRANE ===== -->
  <!-- Crane tower -->
  <rect x="548" y="80" width="13" height="290" fill="url(#bc-craneGrad)" fill-opacity="0.3" stroke="rgba(201,162,39,0.7)" stroke-width="1" filter="url(#bc-beamGlow)"/>
  <!-- Tower lattice -->
  <g stroke="rgba(201,162,39,0.5)" stroke-width="1.2" fill="none">
    <line x1="548" y1="105" x2="561" y2="125"/><line x1="561" y1="105" x2="548" y2="125"/>
    <line x1="548" y1="145" x2="561" y2="165"/><line x1="561" y1="145" x2="548" y2="165"/>
    <line x1="548" y1="185" x2="561" y2="205"/><line x1="561" y1="185" x2="548" y2="205"/>
    <line x1="548" y1="225" x2="561" y2="245"/><line x1="561" y1="225" x2="548" y2="245"/>
    <line x1="548" y1="265" x2="561" y2="285"/><line x1="561" y1="265" x2="548" y2="285"/>
    <line x1="548" y1="305" x2="561" y2="325"/><line x1="561" y1="305" x2="548" y2="325"/>
  </g>
  <!-- Crane cab/top -->
  <rect x="542" y="66" width="25" height="20" rx="3" fill="rgba(201,162,39,0.35)" stroke="rgba(201,162,39,0.8)" stroke-width="1.2"/>
  <rect x="545" y="69" width="9" height="8" rx="1" fill="rgba(255,220,100,0.55)"/>
  <!-- Jib (main arm) -->
  <rect x="430" y="72" width="205" height="11" fill="url(#bc-craneGrad)" fill-opacity="0.25" stroke="rgba(201,162,39,0.75)" stroke-width="1.5" filter="url(#bc-beamGlow)"/>
  <!-- Counter-jib (rear arm) -->
  <rect x="561" y="72" width="85" height="9" fill="rgba(201,162,39,0.2)" stroke="rgba(201,162,39,0.5)" stroke-width="1.2"/>
  <!-- Counter-weight block -->
  <rect x="632" y="65" width="26" height="22" rx="2" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.75)" stroke-width="1.5"/>
  <!-- Guy wires from tower top to jib ends -->
  <g stroke="rgba(201,162,39,0.35)" stroke-width="1" fill="none">
    <line x1="554" y1="70" x2="435" y2="75"/>
    <line x1="554" y1="70" x2="638" y2="75"/>
  </g>
  <!-- Trolley on jib -->
  <rect x="472" y="70" width="22" height="15" rx="2" fill="rgba(201,162,39,0.5)" stroke="rgba(201,162,39,0.85)" stroke-width="1.2"/>
  <!-- Hook cable -->
  <line x1="483" y1="85" x2="483" y2="195" stroke="rgba(201,162,39,0.75)" stroke-width="2"/>
  <!-- Hook shape -->
  <path d="M478,195 Q474,212 483,218 Q492,224 488,210" fill="none" stroke="rgba(201,162,39,0.85)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== GROUND LEVEL / BASE ===== -->
  <!-- Ground platform -->
  <polygon points="140,480 590,480 660,500 70,500" fill="rgba(15,12,5,0.65)" stroke="rgba(201,162,39,0.15)" stroke-width="1"/>
  <rect x="70" y="488" width="600" height="12" fill="url(#bc-groundGrad)"/>

  <!-- Material stacks left -->
  <g fill="rgba(201,162,39,0.28)" stroke="rgba(201,162,39,0.45)" stroke-width="1">
    <rect x="110" y="465" width="58" height="7" rx="1"/>
    <rect x="112" y="457" width="58" height="7" rx="1"/>
    <rect x="114" y="449" width="58" height="7" rx="1"/>
    <rect x="116" y="441" width="58" height="7" rx="1"/>
    <!-- Pallet slats -->
    <line x1="125" y1="441" x2="125" y2="472"/>
    <line x1="138" y1="441" x2="138" y2="472"/>
    <line x1="151" y1="441" x2="151" y2="472"/>
  </g>
  <!-- Concrete blocks right -->
  <g fill="rgba(201,162,39,0.2)" stroke="rgba(201,162,39,0.35)" stroke-width="1">
    <rect x="582" y="462" width="32" height="18" rx="1"/>
    <rect x="617" y="466" width="28" height="14" rx="1"/>
    <rect x="648" y="470" width="24" height="10" rx="1"/>
    <rect x="582" y="448" width="32" height="13" rx="1"/>
    <rect x="617" y="452" width="28" height="13" rx="1"/>
  </g>
  <!-- Mixing machine shape -->
  <g fill="rgba(201,162,39,0.18)" stroke="rgba(201,162,39,0.35)" stroke-width="1">
    <ellipse cx="680" cy="462" rx="28" ry="20"/>
    <rect x="665" y="462" width="30" height="15" rx="2"/>
    <rect x="672" y="477" width="16" height="8" rx="1"/>
  </g>

  <!-- Atmospheric particles / sparks -->
  <g fill="rgba(255,210,80,0.7)">
    <circle cx="555" cy="170" r="1.5"/>
    <circle cx="575" cy="148" r="1"/>
    <circle cx="542" cy="160" r="1"/>
    <circle cx="580" cy="195" r="1.5"/>
    <circle cx="565" cy="218" r="1"/>
  </g>
  <!-- Background star-dust -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="75" cy="75" r="1"/><circle cx="145" cy="48" r="1.5"/>
    <circle cx="695" cy="55" r="1"/><circle cx="755" cy="90" r="1.5"/>
    <circle cx="60" cy="185" r="1"/><circle cx="730" cy="160" r="1"/>
    <circle cx="210" cy="95" r="1"/>
  </g>

  <!-- Vignette overlay -->
  <rect width="800" height="500" fill="url(#bc-vignette)"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Award Nominees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .nominee-card { transition: transform 0.2s; }
    .nominee-card:hover { transform: translateY(-5px); }
    .winner-badge { background-color: #FFD700; color: #000; }
    .company-link { cursor: pointer; color: #0d6efd; text-decoration: none; }
    .company-link:hover { text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Award Nominees</span>
      <button class="btn btn-outline-light" data-action="goBack">Back</button>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- Auth warning (shown when not logged in) -->
    <div id="authWarning" class="alert alert-warning d-flex align-items-center gap-2 mb-3" style="display:none!important;">
      <i class="bi bi-lock-fill"></i>
      <div><strong>Not authenticated.</strong> You must be logged in as an admin to view this page.</div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <h2 id="awardTitle">Loading...</h2>
        <p id="awardDetails" class="text-muted"></p>
      </div>
    </div>

    <table class="table table-hover table-bordered bg-white shadow-sm">
      <thead class="table-dark">
        <tr>
          <th scope="col">Company Name</th>
          <th scope="col">Website</th>
          <th scope="col">Region</th>
          <th scope="col">Status</th>
          <th scope="col">View Profile</th>
        </tr>
      </thead>
      <tbody id="nomineesContainer">
        <tr><td colspan="5" class="text-center">Loading nominees...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.SUPABASE_CONFIG.url,
      window.SUPABASE_CONFIG.anonKey
    );
    let currentAward = null;

    async function getAuthToken() {
      try {
        const { data } = await supabaseClient.auth.getSession();
        return data?.session?.access_token || null;
      } catch (e) {
        return null;
      }
    }

    async function proxyFetch(body) {
      const token = await getAuthToken();
      if (!token) throw new Error('Not authenticated');
      const res = await fetch('/api/data-proxy', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || json.message || 'API error ' + res.status);
      return json;
    }

    async function checkAuth() {
      const token = await getAuthToken();
      if (!token) {
        document.getElementById('authWarning').style.display = '';
        document.getElementById('nomineesContainer').innerHTML =
          '<tr><td colspan="5" class="text-center text-muted">Please log in to view nominees.</td></tr>';
        return false;
      }
      return true;
    }

    function goBack() {
      window.history.back();
    }

    function openCompanyProfile(companyId, companyName) {
      sessionStorage.setItem('selectedCompanyId', companyId);
      sessionStorage.setItem('selectedCompanyName', companyName);
      window.location.href = 'company-profile.html';
    }

    async function loadPage() {
      const authed = await checkAuth();
      if (!authed) {
        document.getElementById('authWarning').style.display = '';
        document.getElementById('awardTitle').textContent = '';
        return;
      }

      const awardName = sessionStorage.getItem('selectedAwardName');
      console.log('Award name from session:', awardName);

      if (!awardName) {
        document.getElementById('awardTitle').textContent = 'Award not found';
        return;
      }

      document.getElementById('awardTitle').textContent = awardName;

      try {
        // Get award details via data-proxy
        const awardsResult = await proxyFetch({
          table: 'awards',
          operation: 'select',
          select: 'id,award_name,year,region,sector,winner',
          filters: { award_name: awardName },
          pageSize: 1
        });
        const awards = awardsResult.data || [];
        if (awards.length > 0) {
          currentAward = awards[0];
          const details = `Year: ${currentAward.year || 'N/A'} | Region: ${currentAward.region || 'N/A'} | Sector: ${currentAward.sector || 'N/A'}`;
          document.getElementById('awardDetails').textContent = details;
        }

        // Get all organisations with this award via data-proxy
        // Explicitly exclude sensitive fields (email, phone) from the public nominees view
        const orgsResult = await proxyFetch({
          table: 'organisations',
          operation: 'select',
          select: 'id,company_name,website,region,award_name',
          filters: { award_name: awardName },
          pageSize: 1000
        });
        const orgs = orgsResult.data || [];

        if (orgs.length === 0) {
          document.getElementById('nomineesContainer').innerHTML = '<tr><td colspan="5" class="text-center text-muted">No companies found</td></tr>';
          return;
        }

        let html = '';
        orgs.forEach(org => {
          const isWinner = currentAward && currentAward.winner === org.company_name;
          const status = isWinner ? '<span class="badge bg-success">WINNER</span>' : '<span class="badge bg-info">NOMINEE</span>';

          html += `
            <tr>
              <td><a class="company-link" data-action="openCompanyProfile" data-args='["${org.id}","${(org.company_name || '').replace(/'/g, "\\'")}"]'>${org.company_name}</a></td>
              <td><a href="${org.website}" target="_blank">${org.website || 'N/A'}</a></td>
              <td>${org.region || 'N/A'}</td>
              <td>${status}</td>
              <td><button data-action="openCompanyProfile" data-args='["${org.id}","${(org.company_name || '').replace(/'/g, "\\'")}"]' class="btn btn-sm btn-link p-0"><i class="bi bi-eye"></i></button></td>
            </tr>
          `;
        });

        document.getElementById('nomineesContainer').innerHTML = html;

      } catch (err) {
        console.error('Error:', err);
        document.getElementById('nomineesContainer').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading page</td></tr>';
      }
    }

    loadPage();
  </script>

  <script>
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    e.preventDefault();
    var parts = el.dataset.action.split('.');
    var ctx = window, fn = window;
    for (var i = 0; i < parts.length; i++) { ctx = fn; fn = fn[parts[i]]; if (!fn) return; }
    if (typeof fn !== 'function') return;
    var args = [];
    if (el.dataset.args) { try { args = JSON.parse(el.dataset.args); } catch (_e) { return; } }
    fn.apply(ctx, args);
  });
  </script>

</body>
</html>

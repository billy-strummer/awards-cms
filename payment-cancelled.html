<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled — British Trade Awards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-color: #C9A227;
      --gold-light: #F4E5B8;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .cancel-card { max-width: 520px; text-align: center; }
    .cancel-icon { font-size: 4rem; color: #dc3545; }
    h1 { font-family: 'Playfair Display', Georgia, serif; }
    .btn-gold { background: var(--gold-color); color: #000; border: none; font-weight: 600; }
    .btn-gold:hover { background: var(--gold-light); color: #000; }
    @media (max-width: 480px) {
      .cancel-card, .success-card { margin: 8px; padding: 1.5rem 1rem !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card cancel-card mx-auto shadow-sm p-5">
      <div class="cancel-icon mb-3"><i class="bi bi-x-circle-fill" aria-hidden="true"></i></div>
      <h1 class="h3 mb-3">Payment Cancelled</h1>
      <p class="text-muted mb-4">Your payment was not completed. No charges have been made. You can try again or return to the dashboard.</p>
      <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="/" class="btn btn-gold px-4">Return to My Entry Dashboard</a>
        <a href="submit-entry.html" class="btn btn-outline mt-3" style="border-color:#C9A227;color:#C9A227;padding:12px 28px;border-radius:6px;text-decoration:none;display:inline-block;">Try Again</a>
      </div>
    </div>
  </div>
</body>
</html>

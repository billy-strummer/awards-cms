<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Award Nominees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0a0a0a; color: #ffffff; }
    .nominee-card { transition: transform 0.2s; }
    .nominee-card:hover { transform: translateY(-5px); }
    .winner-badge { background-color: #FFD700; color: #000; }
    .company-link { cursor: pointer; color: #0d6efd; text-decoration: none; }
    .company-link:hover { text-decoration: underline; cursor: pointer; }
    @media (max-width: 768px) {
      .nominees-table { font-size: 0.875rem; }
      .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      th, td { padding: 8px 10px; }
    }
    @media (max-width: 480px) {
      .nominees-header { flex-direction: column; gap: 10px; }
      .btn { min-height: 44px; }
      .nominees-table th:nth-child(3),
      .nominees-table td:nth-child(3) { display: none; }
    }
  
    body { background: #0a0a0a !important; color: #ffffff !important; }
    .container, .container-fluid { color: #ffffff; }
    .card, .table { background: #1a1a1a !important; color: #ffffff !important; }
    .table { border-color: rgba(255,255,255,0.1) !important; }
    .table td, .table th { border-color: rgba(255,255,255,0.08) !important; color: #ffffff !important; }
    .table-striped > tbody > tr:nth-of-type(odd) > * { background-color: rgba(255,255,255,0.04) !important; color: #ffffff !important; }
    .table-hover > tbody > tr:hover > * { background-color: rgba(201,162,39,0.08) !important; }
    .card-header, .card-footer { background: #111111 !important; border-color: rgba(255,255,255,0.1) !important; color: #ffffff !important; }
    .text-muted { color: rgba(255,255,255,0.5) !important; }
    .badge.bg-warning, .badge.bg-warning.text-dark { background: #C9A227 !important; color: #000 !important; }
    .badge.bg-primary { background: rgba(201,162,39,0.25) !important; color: #C9A227 !important; }
    .navbar, .navbar-dark { background: rgba(0,0,0,0.6) !important; border-bottom: 1px solid rgba(201,162,39,0.2); }
    .navbar-brand, .nav-link { color: rgba(255,255,255,0.85) !important; }
    a { color: #C9A227; }
    a:hover { color: #e0b93a; }
    h1,h2,h3,h4,h5,h6 { color: #ffffff; }
    .bg-light { background: #111111 !important; }
    .form-control, .form-select { background: #111111 !important; border: 1px solid #2a2a2a !important; color: #ffffff !important; }
    .form-control::placeholder { color: rgba(255,255,255,0.3) !important; }
    .form-select option { background: #111111; color: #ffffff; }
    .btn-primary { background: linear-gradient(135deg, #a07d1a, #C9A227) !important; border: none !important; color: #000 !important; font-weight: 700 !important; }
    .company-link { color: #C9A227 !important; }

  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Award Nominees</span>
      <button class="btn btn-outline-light" data-action="goBack">Back</button>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- Auth warning (shown when not logged in) -->
    <div id="authWarning" class="alert alert-warning d-flex align-items-center gap-2 mb-3 d-none" role="alert">
      <i class="bi bi-lock-fill"></i>
      <div><strong>Not authenticated.</strong> You must be logged in as an admin to view this page.</div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <h2 id="awardTitle">Loading...</h2>
        <p id="awardDetails" class="text-muted"></p>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-bordered bg-white shadow-sm nominees-table" aria-label="Award nominees list">
        <thead class="table-dark">
          <tr>
            <th scope="col">Company Name</th>
            <th scope="col">Website</th>
            <th scope="col">Region</th>
            <th scope="col">Status</th>
            <th scope="col">View Profile</th>
          </tr>
        </thead>
        <tbody id="nomineesContainer">
          <tr><td colspan="5" class="text-center">Loading nominees...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="config.js"></script>

  <script src="public-utils.js"></script>
  <script src="award-nominees-app.js"></script>

</body>
</html>

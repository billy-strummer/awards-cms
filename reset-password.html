<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="supabase-url" content="">
  <meta name="supabase-anon-key" content="">
  <title>Reset Password - British Trade Awards</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/logos/non-stacked/BTA_Corporate_Horizontal-Texture.png" type="image/png">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="config.js"></script>

  <style>
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reset-card {
      max-width: 440px;
      width: 100%;
      margin: 16px;
      background: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .reset-header {
      background: linear-gradient(180deg, #111111 0%, #0d0d0d 100%);
      border-bottom: 2px solid rgba(201,162,39,0.4);
      color: #C9A227;
      padding: 2rem;
      text-align: center;
    }
    .reset-header h1 { margin: 0; font-size: 1.4rem; }
    .reset-header p { margin: 0.5rem 0 0; opacity: 0.85; font-size: 0.9rem; }
    .reset-body { padding: 2rem; }
    .reset-body .form-label { font-weight: 500; font-size: 0.9rem; color: rgba(255,255,255,0.65); }
    .reset-body .form-control { background: #111111; border: 1px solid #2a2a2a; color: #ffffff; }
    .reset-body .form-control:focus { background: #111111; color: #ffffff; border-color: #C9A227; box-shadow: 0 0 0 3px rgba(201,162,39,0.15); }
    .reset-body .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .text-muted { color: rgba(255,255,255,0.5) !important; }
    a.text-muted { color: rgba(255,255,255,0.4) !important; }
    .btn-reset {
      background: linear-gradient(135deg, #a07d1a 0%, #C9A227 50%, #e8c84a 100%);
      border: none;
      color: #000;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      width: 100%;
    }
    .btn-reset:hover { filter: brightness(1.08); color: #000; }
    .btn-reset:disabled { opacity: 0.6; }
    .alert { font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="reset-card">
    <div class="reset-header">
      <i class="bi bi-shield-lock display-4 d-block mb-2" aria-hidden="true"></i>
      <h1>Reset Your Password</h1>
      <p>British Trade Awards Admin</p>
    </div>

    <div class="reset-body">
      <div id="resetError" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
      <div id="resetSuccess" class="alert alert-success d-none" role="alert" aria-live="polite"></div>

      <!-- Shown once a valid recovery link has been detected -->
      <form id="resetPasswordForm" class="d-none">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="confirmPassword" required minlength="8" placeholder="Re-enter password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-reset" id="resetBtn">
          <i class="bi bi-check-lg me-2"></i>Set New Password
        </button>
      </form>

      <!-- Shown while we're still checking the link, or if it's invalid/expired -->
      <div id="resetPending" class="text-center text-muted py-3">
        <div class="spinner-border spinner-border-sm mb-2" role="status"><span class="visually-hidden">Checking link…</span></div>
        <p class="mb-0 small">Verifying your reset link…</p>
      </div>

      <div class="text-center mt-3">
        <a href="index.html" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>

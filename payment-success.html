<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - British Trade Awards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-color: #D4AF37;
      --gold-light: #F4E5B8;
    }
    body { font-family: 'Montserrat', sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .success-card { max-width: 520px; text-align: center; }
    .success-icon { font-size: 4rem; color: #28a745; }
    h1 { font-family: 'Cinzel', serif; }
    .btn-gold { background: var(--gold-color); color: #000; border: none; font-weight: 600; }
    .btn-gold:hover { background: var(--gold-light); color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card success-card mx-auto shadow-sm p-5">
      <div class="success-icon mb-3"><i class="bi bi-check-circle-fill"></i></div>
      <h1 class="h3 mb-3">Payment Successful</h1>
      <p class="text-muted mb-4">Thank you! Your payment has been processed successfully. You will receive a confirmation email shortly.</p>
      <div id="entryInfo" class="mb-4"></div>
      <a href="/" class="btn btn-gold px-4">Return to Dashboard</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const entryId = params.get('entry');
    if (entryId) {
      document.getElementById('entryInfo').innerHTML =
        '<p class="small text-muted">Entry reference: <strong>' + entryId.substring(0, 8) + '</strong></p>';
    }
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cj-bgWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="40%" stop-color="#231708"/>
      <stop offset="100%" stop-color="#1a1005"/>
    </linearGradient>
    <radialGradient id="cj-bgGlow" cx="48%" cy="52%" r="55%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.15)"/>
      <stop offset="60%" stop-color="rgba(201,162,39,0.04)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <radialGradient id="cj-benchGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.12)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <linearGradient id="cj-planeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,240,180,0.18)"/>
      <stop offset="30%" stop-color="rgba(201,162,39,0.65)"/>
      <stop offset="70%" stop-color="rgba(201,162,39,0.55)"/>
      <stop offset="100%" stop-color="rgba(120,90,20,0.5)"/>
    </linearGradient>
    <linearGradient id="cj-planeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,245,190,0.25)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.5)"/>
    </linearGradient>
    <linearGradient id="cj-woodGrain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.06)"/>
      <stop offset="50%" stop-color="rgba(201,162,39,0.12)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.06)"/>
    </linearGradient>
    <filter id="cj-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cj-shavingGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="cj-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="800" height="500" fill="url(#cj-bgWood)"/>
  <rect width="800" height="500" fill="url(#cj-bgGlow)"/>
  <rect width="800" height="500" fill="url(#cj-benchGlow)"/>

  <!-- ===== WOOD GRAIN BACKGROUND TEXTURE ===== -->
  <!-- Deep grain lines — wavy horizontal, varying opacities -->
  <g fill="none" stroke-linecap="round">
    <!-- Very dark grain -->
    <path d="M0,18 Q120,14 240,20 Q360,26 480,18 Q600,10 800,16" stroke="rgba(100,68,15,0.45)" stroke-width="2.5"/>
    <path d="M0,35 Q100,30 220,38 Q380,46 520,34 Q660,22 800,32" stroke="rgba(80,52,10,0.4)" stroke-width="1.8"/>
    <path d="M0,55 Q140,50 280,58 Q420,66 560,54 Q700,42 800,52" stroke="rgba(130,88,18,0.35)" stroke-width="2"/>
    <path d="M0,72 Q90,68 200,76 Q350,84 500,72 Q650,60 800,70" stroke="rgba(100,68,15,0.4)" stroke-width="1.5"/>
    <path d="M0,90 Q160,85 320,93 Q480,101 640,88 Q720,82 800,90" stroke="rgba(150,100,22,0.3)" stroke-width="2.2"/>
    <path d="M0,108 Q130,103 260,112 Q390,120 520,108 Q680,96 800,106" stroke="rgba(80,52,10,0.35)" stroke-width="1.8"/>
    <path d="M0,125 Q110,120 230,128 Q370,137 510,124 Q660,111 800,122" stroke="rgba(120,82,16,0.38)" stroke-width="1.5"/>
    <path d="M0,142 Q150,137 300,145 Q450,154 600,141 Q700,133 800,140" stroke="rgba(100,68,15,0.32)" stroke-width="2"/>
    <path d="M0,160 Q120,155 260,164 Q400,172 540,160 Q680,148 800,158" stroke="rgba(60,40,8,0.4)" stroke-width="2.5"/>
    <path d="M0,178 Q95,173 200,181 Q360,189 520,178 Q660,167 800,175" stroke="rgba(140,95,20,0.28)" stroke-width="1.5"/>
    <path d="M0,195 Q140,190 280,198 Q420,207 560,195 Q700,183 800,192" stroke="rgba(100,68,15,0.35)" stroke-width="1.8"/>
    <path d="M0,213 Q115,208 235,217 Q380,226 525,213 Q670,200 800,210" stroke="rgba(80,52,10,0.38)" stroke-width="2"/>
    <path d="M0,230 Q130,225 265,234 Q400,242 535,230 Q680,218 800,227" stroke="rgba(160,108,24,0.25)" stroke-width="1.5"/>
    <path d="M0,248 Q100,243 220,251 Q360,260 500,248 Q660,235 800,245" stroke="rgba(100,68,15,0.32)" stroke-width="2"/>
    <path d="M0,265 Q145,260 290,269 Q430,277 570,265 Q700,253 800,262" stroke="rgba(80,52,10,0.36)" stroke-width="1.8"/>
    <path d="M0,282 Q120,277 250,286 Q390,295 530,282 Q670,269 800,278" stroke="rgba(130,88,18,0.3)" stroke-width="2.2"/>
    <path d="M0,300 Q110,295 230,303 Q375,312 520,300 Q660,288 800,296" stroke="rgba(100,68,15,0.28)" stroke-width="1.5"/>
    <path d="M0,318 Q130,313 265,322 Q405,330 545,318 Q680,306 800,314" stroke="rgba(80,52,10,0.35)" stroke-width="1.8"/>
    <path d="M0,335 Q150,330 295,339 Q435,347 575,334 Q705,322 800,331" stroke="rgba(140,95,20,0.32)" stroke-width="2"/>
    <path d="M0,353 Q120,348 250,357 Q390,365 530,352 Q670,340 800,348" stroke="rgba(100,68,15,0.3)" stroke-width="1.5"/>
    <path d="M0,370 Q100,365 215,374 Q360,383 505,370 Q655,357 800,365" stroke="rgba(80,52,10,0.38)" stroke-width="2.2"/>
    <path d="M0,388 Q135,383 275,392 Q415,400 555,388 Q700,376 800,384" stroke="rgba(120,82,16,0.28)" stroke-width="1.8"/>
    <path d="M0,405 Q115,400 240,408 Q380,417 520,404 Q660,392 800,400" stroke="rgba(100,68,15,0.35)" stroke-width="2"/>
    <path d="M0,422 Q140,417 285,426 Q425,434 565,422 Q705,410 800,418" stroke="rgba(80,52,10,0.32)" stroke-width="1.5"/>
    <path d="M0,440 Q120,435 250,444 Q390,453 530,440 Q665,427 800,435" stroke="rgba(150,100,22,0.28)" stroke-width="2"/>
    <path d="M0,458 Q110,453 235,462 Q375,470 515,457 Q658,444 800,452" stroke="rgba(100,68,15,0.3)" stroke-width="1.8"/>
    <path d="M0,475 Q130,470 265,478 Q405,487 545,474 Q685,461 800,469" stroke="rgba(80,52,10,0.35)" stroke-width="2.2"/>
    <path d="M0,492 Q145,487 290,496 Q430,500 570,490 Q710,478 800,485" stroke="rgba(120,82,16,0.25)" stroke-width="1.5"/>
  </g>

  <!-- Wood knot patterns -->
  <ellipse cx="185" cy="195" rx="42" ry="28" fill="none" stroke="rgba(100,65,12,0.45)" stroke-width="2.5"/>
  <ellipse cx="185" cy="195" rx="28" ry="18" fill="none" stroke="rgba(100,65,12,0.35)" stroke-width="1.8"/>
  <ellipse cx="185" cy="195" rx="14" ry="9" fill="rgba(80,50,10,0.3)" stroke="rgba(100,65,12,0.28)" stroke-width="1.5"/>
  <ellipse cx="640" cy="370" rx="52" ry="34" fill="none" stroke="rgba(100,65,12,0.4)" stroke-width="2.5"/>
  <ellipse cx="640" cy="370" rx="34" ry="22" fill="none" stroke="rgba(100,65,12,0.3)" stroke-width="1.8"/>
  <ellipse cx="640" cy="370" rx="16" ry="10" fill="rgba(80,50,10,0.28)" stroke="rgba(100,65,12,0.25)" stroke-width="1.5"/>
  <!-- Smaller knot -->
  <ellipse cx="720" cy="130" rx="30" ry="18" fill="none" stroke="rgba(100,65,12,0.3)" stroke-width="2"/>
  <ellipse cx="720" cy="130" rx="16" ry="9" fill="rgba(80,50,10,0.22)" stroke="rgba(100,65,12,0.22)" stroke-width="1.2"/>

  <!-- Sawdust ellipses scattered on surface -->
  <g fill="rgba(201,162,39,0.1)">
    <ellipse cx="135" cy="345" rx="6" ry="2.5" transform="rotate(-15,135,345)"/>
    <ellipse cx="165" cy="358" rx="4.5" ry="2" transform="rotate(25,165,358)"/>
    <ellipse cx="148" cy="370" rx="5" ry="2" transform="rotate(-5,148,370)"/>
    <ellipse cx="680" cy="300" rx="5.5" ry="2" transform="rotate(10,680,300)"/>
    <ellipse cx="700" cy="315" rx="4" ry="1.8" transform="rotate(-20,700,315)"/>
    <ellipse cx="665" cy="290" rx="6" ry="2.5" transform="rotate(15,665,290)"/>
    <ellipse cx="420" cy="455" rx="5" ry="2" transform="rotate(-10,420,455)"/>
    <ellipse cx="445" cy="468" rx="6.5" ry="2.5" transform="rotate(20,445,468)"/>
    <ellipse cx="400" cy="470" rx="4" ry="1.8" transform="rotate(-5,400,470)"/>
    <ellipse cx="350" cy="460" rx="5" ry="2" transform="rotate(12,350,460)"/>
    <ellipse cx="490" cy="462" rx="5.5" ry="2.2" transform="rotate(-8,490,462)"/>
  </g>

  <!-- ===== WORKBENCH SURFACE (bottom) ===== -->
  <rect x="60" y="400" width="680" height="60" rx="4" fill="rgba(201,162,39,0.12)" stroke="rgba(201,162,39,0.3)" stroke-width="1.5"/>
  <!-- Bench edge highlight -->
  <line x1="62" y1="402" x2="738" y2="402" stroke="rgba(255,240,180,0.2)" stroke-width="1.5"/>
  <!-- Bench grain lines -->
  <g stroke="rgba(100,68,15,0.3)" stroke-width="1" fill="none">
    <line x1="65" y1="415" x2="735" y2="415"/>
    <line x1="65" y1="428" x2="735" y2="428"/>
    <line x1="65" y1="441" x2="735" y2="441"/>
  </g>
  <!-- Bench vice -->
  <rect x="68" y="405" width="45" height="50" rx="3" fill="rgba(201,162,39,0.25)" stroke="rgba(201,162,39,0.5)" stroke-width="1.2"/>
  <rect x="55" y="412" width="16" height="36" rx="2" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.6)" stroke-width="1"/>
  <!-- Vice screw -->
  <line x1="50" y1="430" x2="70" y2="430" stroke="rgba(201,162,39,0.7)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="430" r="6" fill="rgba(201,162,39,0.5)" stroke="rgba(201,162,39,0.7)" stroke-width="1"/>

  <!-- ===== HAND PLANE (main focal element) ===== -->
  <!-- Plane shadow -->
  <ellipse cx="395" cy="398" rx="145" ry="12" fill="rgba(0,0,0,0.5)"/>

  <!-- Plane body (isometric-ish view at slight angle) -->
  <!-- Body - main rectangular block -->
  <rect x="235" y="300" width="320" height="85" rx="6" fill="url(#cj-planeBody)" stroke="rgba(201,162,39,0.7)" stroke-width="2"/>
  <!-- Body top surface (lighter) -->
  <rect x="237" y="302" width="316" height="40" rx="4" fill="url(#cj-planeTop)" stroke="none"/>
  <!-- Top edge highlight -->
  <line x1="240" y1="304" x2="553" y2="304" stroke="rgba(255,245,190,0.4)" stroke-width="1.5"/>
  <!-- Body side ribs / details -->
  <g stroke="rgba(255,240,160,0.2)" stroke-width="1" fill="none">
    <line x1="280" y1="302" x2="280" y2="383"/>
    <line x1="330" y1="302" x2="330" y2="383"/>
    <line x1="430" y1="302" x2="430" y2="383"/>
    <line x1="480" y1="302" x2="480" y2="383"/>
  </g>
  <!-- Blade slot (opening in sole) -->
  <rect x="330" y="358" width="100" height="14" rx="2" fill="rgba(10,8,3,0.85)" stroke="rgba(201,162,39,0.5)" stroke-width="1.2"/>
  <!-- Blade visible in slot -->
  <rect x="332" y="358" width="96" height="8" rx="1" fill="rgba(201,162,39,0.4)" stroke="rgba(255,240,150,0.5)" stroke-width="0.8"/>
  <!-- Chip breaker -->
  <rect x="350" y="310" width="60" height="55" rx="2" fill="rgba(201,162,39,0.45)" stroke="rgba(255,240,150,0.4)" stroke-width="1"/>
  <rect x="360" y="314" width="40" height="8" rx="1" fill="rgba(255,240,150,0.15)"/>
  <!-- Plane cap iron (lever cap) -->
  <path d="M345,308 Q380,295 415,308 L415,325 Q380,318 345,325 Z" fill="rgba(201,162,39,0.6)" stroke="rgba(255,240,150,0.45)" stroke-width="1.2"/>
  <circle cx="380" cy="315" r="5" fill="rgba(255,240,150,0.5)" stroke="rgba(201,162,39,0.7)" stroke-width="1"/>

  <!-- Front tote (knob at front) -->
  <ellipse cx="270" cy="330" rx="22" ry="34" fill="rgba(140,90,18,0.6)" stroke="rgba(201,162,39,0.65)" stroke-width="1.5"/>
  <ellipse cx="270" cy="320" rx="12" ry="14" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.55)" stroke-width="1"/>
  <!-- Front tote wood grain detail -->
  <g stroke="rgba(255,240,160,0.18)" stroke-width="0.8" fill="none">
    <path d="M258,318 Q270,315 282,318"/>
    <path d="M255,325 Q270,322 285,325"/>
    <path d="M254,332 Q270,329 286,332"/>
  </g>

  <!-- Rear handle (tote) -->
  <path d="M510,300 Q540,290 555,305 L555,355 Q545,370 520,375 L505,365 Q518,355 520,340 L510,340 Z"
    fill="rgba(140,90,18,0.55)" stroke="rgba(201,162,39,0.6)" stroke-width="1.5"/>
  <!-- Handle hole -->
  <ellipse cx="528" cy="338" rx="14" ry="18" fill="rgba(0,0,0,0.6)" stroke="rgba(201,162,39,0.4)" stroke-width="1"/>
  <!-- Handle grain lines -->
  <g stroke="rgba(255,240,160,0.15)" stroke-width="0.8" fill="none">
    <path d="M512,310 Q530,307 548,312"/>
    <path d="M511,320 Q530,317 550,322"/>
    <path d="M510,330 Q528,327 548,332"/>
  </g>
  <!-- Plane adjuster knob on side -->
  <circle cx="390" cy="345" r="8" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.65)" stroke-width="1.2"/>
  <line x1="382" y1="345" x2="398" y2="345" stroke="rgba(255,240,150,0.5)" stroke-width="1"/>
  <line x1="390" y1="337" x2="390" y2="353" stroke="rgba(255,240,150,0.5)" stroke-width="1"/>
  <!-- Depth adjuster -->
  <rect x="395" y="340" width="20" height="10" rx="3" fill="rgba(201,162,39,0.5)" stroke="rgba(201,162,39,0.7)" stroke-width="1"/>

  <!-- ===== WOOD SHAVINGS coming off plane ===== -->
  <g filter="url(#cj-shavingGlow)">
    <!-- Large curling shaving 1 -->
    <path d="M556,348 Q580,340 600,350 Q625,362 640,348 Q658,332 675,345 Q690,356 685,370"
      fill="none" stroke="rgba(201,162,39,0.7)" stroke-width="3" stroke-linecap="round"/>
    <!-- Shaving body fill -->
    <path d="M556,348 Q580,340 600,350 Q625,362 640,348 Q658,332 675,345 Q690,356 685,370 Q683,376 678,372 Q668,360 650,352 Q635,342 618,356 Q600,370 578,358 Q564,350 556,354 Z"
      fill="rgba(201,162,39,0.22)" stroke="none"/>

    <!-- Shaving 2 smaller curling up -->
    <path d="M558,335 Q575,322 595,335 Q615,348 635,332 Q650,320 665,330 Q678,340 672,355"
      fill="none" stroke="rgba(201,162,39,0.55)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M558,335 Q575,322 595,335 Q615,348 635,332 Q650,320 665,330 Q678,340 672,355 Q670,360 666,357 Q655,345 640,338 Q620,327 600,342 Q582,355 565,342 Q558,337 556,340 Z"
      fill="rgba(201,162,39,0.15)" stroke="none"/>

    <!-- Small shaving 3 - flies up -->
    <path d="M560,320 Q572,305 588,315 Q602,325 614,310"
      fill="none" stroke="rgba(201,162,39,0.45)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Tiny shavings scattering -->
    <path d="M570,360 Q580,350 590,360" fill="none" stroke="rgba(201,162,39,0.4)" stroke-width="1.5"/>
    <path d="M610,355 Q622,342 634,350" fill="none" stroke="rgba(201,162,39,0.4)" stroke-width="1.5"/>
    <path d="M648,358 Q658,345 668,352" fill="none" stroke="rgba(201,162,39,0.35)" stroke-width="1.2"/>
    <path d="M680,340 Q690,328 698,336" fill="none" stroke="rgba(201,162,39,0.35)" stroke-width="1.2"/>
  </g>

  <!-- ===== DOVETAIL JOINT (lower right corner) ===== -->
  <!-- Two interlocking pieces showing the joint -->
  <g fill="rgba(201,162,39,0.12)" stroke="rgba(201,162,39,0.45)" stroke-width="1.5">
    <!-- Horizontal piece (pins piece) -->
    <polygon points="600,395 710,395 710,455 600,455 600,445 612,440 600,435 612,430 600,420 612,415 600,410 Z"/>
    <!-- Vertical piece (tails piece) that interleaves -->
    <polygon points="610,380 622,395 610,408 622,410 610,422 622,424 610,436 622,438 610,448 622,456 610,456 610,380"/>
    <!-- Highlight edge of dovetail -->
    <line x1="600" y1="395" x2="600" y2="455" stroke="rgba(255,240,160,0.3)" stroke-width="1"/>
  </g>
  <!-- Second dovetail piece (darker, depth illusion) -->
  <g fill="rgba(201,162,39,0.08)" stroke="rgba(201,162,39,0.3)" stroke-width="1.2">
    <polygon points="625,380 637,395 625,408 637,410 625,422 637,424 625,436 637,438 625,448 637,395 625,380"/>
  </g>
  <!-- Joint label highlight (connecting line) -->
  <line x1="608" y1="378" x2="608" y2="460" stroke="rgba(255,240,160,0.2)" stroke-width="0.8"/>

  <!-- ===== ADDITIONAL TOOLS ===== -->
  <!-- Chisel lying flat on bench -->
  <g transform="translate(140,415) rotate(-8,100,15)">
    <rect x="0" y="8" width="170" height="12" rx="3" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.6)" stroke-width="1.2"/>
    <!-- Chisel handle -->
    <rect x="0" y="5" width="55" height="18" rx="4" fill="rgba(140,90,18,0.55)" stroke="rgba(201,162,39,0.55)" stroke-width="1"/>
    <!-- Ferrule rings -->
    <rect x="50" y="6" width="8" height="16" rx="1" fill="rgba(201,162,39,0.6)" stroke="rgba(201,162,39,0.8)" stroke-width="0.8"/>
    <!-- Blade tip angle -->
    <polygon points="165,10 170,14 165,18" fill="rgba(255,240,150,0.5)" stroke="rgba(201,162,39,0.6)" stroke-width="0.8"/>
  </g>

  <!-- Wooden mallet on bench -->
  <g transform="translate(210,405)">
    <rect x="0" y="0" width="16" height="65" rx="4" fill="rgba(140,90,18,0.5)" stroke="rgba(201,162,39,0.45)" stroke-width="1"/>
    <!-- Mallet head -->
    <rect x="-18" y="0" width="52" height="30" rx="4" fill="rgba(120,78,15,0.65)" stroke="rgba(201,162,39,0.6)" stroke-width="1.2"/>
    <!-- Head grain line -->
    <line x1="-16" y1="15" x2="32" y2="15" stroke="rgba(255,240,160,0.2)" stroke-width="1"/>
  </g>

  <!-- ===== SAWDUST TEXTURE (fine dots) ===== -->
  <g fill="rgba(201,162,39,0.2)">
    <circle cx="320" cy="395" r="1.5"/><circle cx="340" cy="398" r="1"/>
    <circle cx="360" cy="392" r="1.5"/><circle cx="380" cy="396" r="1"/>
    <circle cx="310" cy="402" r="1"/><circle cx="350" cy="405" r="1.5"/>
    <circle cx="375" cy="403" r="1"/><circle cx="420" cy="395" r="1.5"/>
    <circle cx="440" cy="398" r="1"/><circle cx="460" cy="393" r="1.5"/>
    <circle cx="480" cy="396" r="1"/><circle cx="500" cy="400" r="1.5"/>
    <circle cx="295" cy="393" r="1"/><circle cx="515" cy="397" r="1"/>
  </g>

  <!-- Vignette -->
  <rect width="800" height="500" fill="url(#cj-vignette)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d0d"/>
      <stop offset="50%" style="stop-color:#24100e"/>
      <stop offset="100%" style="stop-color:#1f0e0c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Technical grid -->
  <g fill="none" stroke="rgba(201,162,39,0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- Wrench -->
  <g fill="rgba(201,162,39,0.28)" transform="translate(200,150) rotate(-45,60,60)">
    <rect x="50" y="15" width="20" height="90" rx="4"/>
    <circle cx="60" cy="20" r="22" fill="none" stroke="rgba(201,162,39,0.28)" stroke-width="8"/>
    <circle cx="60" cy="95" r="15"/>
  </g>
  <!-- Hammer -->
  <g fill="rgba(201,162,39,0.28)" transform="translate(430,130) rotate(30,60,80)">
    <rect x="55" y="60" width="10" height="100" rx="3"/>
    <rect x="35" y="50" width="50" height="30" rx="4"/>
  </g>
  <!-- Screwdriver -->
  <g stroke="rgba(201,162,39,0.25)" stroke-width="6" fill="none" transform="translate(550,380) rotate(-60,0,0)">
    <line x1="0" y1="-80" x2="0" y2="80"/>
    <rect x="-10" y="-80" width="20" height="40" rx="3" fill="rgba(201,162,39,0.25)" stroke="none"/>
    <line x1="-8" y1="75" x2="8" y2="75"/>
  </g>
  <!-- Circular saw blade -->
  <g transform="translate(600,200)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(201,162,39,0.2)" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="rgba(201,162,39,0.2)" stroke-width="3"/>
    <!-- Teeth -->
    <g stroke="rgba(201,162,39,0.2)" stroke-width="2">
      <line x1="0" y1="-55" x2="0" y2="-68"/><line x1="27" y1="-47" x2="33" y2="-58"/>
      <line x1="47" y1="-27" x2="58" y2="-33"/><line x1="55" y1="0" x2="68" y2="0"/>
      <line x1="47" y1="27" x2="58" y2="33"/><line x1="27" y1="47" x2="33" y2="58"/>
      <line x1="0" y1="55" x2="0" y2="68"/><line x1="-27" y1="47" x2="-33" y2="58"/>
      <line x1="-47" y1="27" x2="-58" y2="33"/><line x1="-55" y1="0" x2="-68" y2="0"/>
      <line x1="-47" y1="-27" x2="-58" y2="-33"/><line x1="-27" y1="-47" x2="-33" y2="-58"/>
    </g>
  </g>
</svg>

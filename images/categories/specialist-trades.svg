<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="st-bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100c0c"/>
      <stop offset="50%" stop-color="#140e0e"/>
      <stop offset="100%" stop-color="#1c1212"/>
    </linearGradient>
    <radialGradient id="st-bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.1)"/>
      <stop offset="55%" stop-color="rgba(201,162,39,0.02)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <!-- Tool body gradient -->
    <linearGradient id="st-toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,245,180,0.15)"/>
      <stop offset="30%" stop-color="rgba(201,162,39,0.7)"/>
      <stop offset="70%" stop-color="rgba(201,162,39,0.6)"/>
      <stop offset="100%" stop-color="rgba(120,90,20,0.5)"/>
    </linearGradient>
    <linearGradient id="st-toolSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(80,60,15,0.5)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.6)"/>
    </linearGradient>
    <filter id="st-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="st-sharpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="st-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
    </radialGradient>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="800" height="500" fill="url(#st-bgBase)"/>
  <rect width="800" height="500" fill="url(#st-bgGlow)"/>

  <!-- ===== GRAPH PAPER / MEASUREMENT GRID BACKGROUND ===== -->
  <!-- Major grid lines -->
  <g stroke="rgba(201,162,39,0.07)" stroke-width="0.8" fill="none">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/><line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>
  <!-- Minor grid lines (5px spacing, very faint) -->
  <g stroke="rgba(201,162,39,0.03)" stroke-width="0.5" fill="none">
    <line x1="0" y1="25" x2="800" y2="25"/><line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="125" x2="800" y2="125"/><line x1="0" y1="175" x2="800" y2="175"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="275" x2="800" y2="275"/>
    <line x1="0" y1="325" x2="800" y2="325"/><line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="0" y1="425" x2="800" y2="425"/><line x1="0" y1="475" x2="800" y2="475"/>
    <line x1="25" y1="0" x2="25" y2="500"/><line x1="75" y1="0" x2="75" y2="500"/>
    <line x1="125" y1="0" x2="125" y2="500"/><line x1="175" y1="0" x2="175" y2="500"/>
    <line x1="225" y1="0" x2="225" y2="500"/><line x1="275" y1="0" x2="275" y2="500"/>
    <line x1="325" y1="0" x2="325" y2="500"/><line x1="375" y1="0" x2="375" y2="500"/>
    <line x1="425" y1="0" x2="425" y2="500"/><line x1="475" y1="0" x2="475" y2="500"/>
    <line x1="525" y1="0" x2="525" y2="500"/><line x1="575" y1="0" x2="575" y2="500"/>
    <line x1="625" y1="0" x2="625" y2="500"/><line x1="675" y1="0" x2="675" y2="500"/>
    <line x1="725" y1="0" x2="725" y2="500"/><line x1="775" y1="0" x2="775" y2="500"/>
  </g>

  <!-- ===== SPIRIT LEVEL (centre-horizontal, main focal item) ===== -->
  <!-- Spirit level body — long horizontal rectangle -->
  <rect x="120" y="232" width="560" height="36" rx="5"
    fill="rgba(201,162,39,0.12)" stroke="rgba(201,162,39,0.65)" stroke-width="2" filter="url(#st-sharpGlow)"/>
  <!-- Top edge highlight -->
  <line x1="122" y1="234" x2="678" y2="234" stroke="rgba(255,245,180,0.3)" stroke-width="1.5"/>
  <!-- Bottom shadow line -->
  <line x1="122" y1="266" x2="678" y2="266" stroke="rgba(80,60,15,0.4)" stroke-width="1"/>
  <!-- End caps -->
  <rect x="118" y="228" width="12" height="44" rx="3" fill="rgba(201,162,39,0.55)" stroke="rgba(201,162,39,0.8)" stroke-width="1.2"/>
  <rect x="670" y="228" width="12" height="44" rx="3" fill="rgba(201,162,39,0.55)" stroke="rgba(201,162,39,0.8)" stroke-width="1.2"/>
  <!-- Grip texture lines on body -->
  <g stroke="rgba(201,162,39,0.2)" stroke-width="0.8" fill="none">
    <line x1="180" y1="232" x2="180" y2="268"/>
    <line x1="190" y1="232" x2="190" y2="268"/>
    <line x1="200" y1="232" x2="200" y2="268"/>
    <line x1="580" y1="232" x2="580" y2="268"/>
    <line x1="590" y1="232" x2="590" y2="268"/>
    <line x1="600" y1="232" x2="600" y2="268"/>
  </g>
  <!-- Measurement ruler markings on top edge -->
  <g stroke="rgba(201,162,39,0.55)" stroke-width="1" fill="none">
    <!-- Major ticks every 50px -->
    <line x1="170" y1="232" x2="170" y2="240"/><line x1="220" y1="232" x2="220" y2="240"/>
    <line x1="270" y1="232" x2="270" y2="240"/><line x1="320" y1="232" x2="320" y2="240"/>
    <line x1="370" y1="232" x2="370" y2="240"/><line x1="420" y1="232" x2="420" y2="240"/>
    <line x1="470" y1="232" x2="470" y2="240"/><line x1="520" y1="232" x2="520" y2="240"/>
    <line x1="570" y1="232" x2="570" y2="240"/><line x1="620" y1="232" x2="620" y2="240"/>
    <line x1="670" y1="232" x2="670" y2="240"/>
  </g>
  <g stroke="rgba(201,162,39,0.3)" stroke-width="0.7" fill="none">
    <!-- Minor ticks every 25px -->
    <line x1="145" y1="232" x2="145" y2="237"/><line x1="195" y1="232" x2="195" y2="237"/>
    <line x1="245" y1="232" x2="245" y2="237"/><line x1="295" y1="232" x2="295" y2="237"/>
    <line x1="345" y1="232" x2="345" y2="237"/><line x1="395" y1="232" x2="395" y2="237"/>
    <line x1="445" y1="232" x2="445" y2="237"/><line x1="495" y1="232" x2="495" y2="237"/>
    <line x1="545" y1="232" x2="545" y2="237"/><line x1="595" y1="232" x2="595" y2="237"/>
    <line x1="645" y1="232" x2="645" y2="237"/>
  </g>

  <!-- Spirit level VIAL (centre bubble indicator) -->
  <rect x="355" y="238" width="90" height="24" rx="12"
    fill="rgba(30,80,60,0.4)" stroke="rgba(201,162,39,0.7)" stroke-width="1.5"/>
  <!-- Vial tick marks -->
  <g stroke="rgba(201,162,39,0.7)" stroke-width="1" fill="none">
    <line x1="388" y1="238" x2="388" y2="262"/>
    <line x1="400" y1="236" x2="400" y2="264"/>
    <line x1="412" y1="238" x2="412" y2="262"/>
  </g>
  <!-- Bubble (centred = level) -->
  <ellipse cx="400" cy="250" rx="14" ry="9" fill="rgba(100,220,180,0.35)" stroke="rgba(150,255,220,0.6)" stroke-width="1.5"/>
  <ellipse cx="398" cy="248" rx="6" ry="4" fill="rgba(200,255,240,0.25)"/>

  <!-- ===== SET SQUARE / TRIANGLE ===== -->
  <!-- Large right-angle triangle outline -->
  <polygon points="160,430 160,120 440,430"
    fill="rgba(201,162,39,0.04)" stroke="rgba(201,162,39,0.6)" stroke-width="2" filter="url(#st-sharpGlow)"/>
  <!-- Inner parallel line (thickness detail) -->
  <polygon points="165,425 165,130 432,425"
    fill="none" stroke="rgba(201,162,39,0.2)" stroke-width="0.8"/>
  <!-- Right-angle mark at corner (160,430) -->
  <path d="M160,410 L178,410 L178,430" fill="none" stroke="rgba(201,162,39,0.6)" stroke-width="1.8"/>
  <!-- Hypotenuse measurement divisions -->
  <g stroke="rgba(201,162,39,0.35)" stroke-width="1" fill="none">
    <line x1="196" y1="382" x2="202" y2="376"/>
    <line x1="232" y1="334" x2="238" y2="328"/>
    <line x1="268" y1="286" x2="274" y2="280"/>
    <line x1="304" y1="238" x2="310" y2="232"/>
    <line x1="340" y1="190" x2="346" y2="184"/>
    <line x1="376" y1="142" x2="382" y2="136"/>
    <line x1="412" y1="94" x2="418" y2="88"/>
  </g>
  <!-- Vertical edge tick marks -->
  <g stroke="rgba(201,162,39,0.3)" stroke-width="0.8" fill="none">
    <line x1="160" y1="160" x2="168" y2="160"/><line x1="160" y1="200" x2="168" y2="200"/>
    <line x1="160" y1="240" x2="168" y2="240"/><line x1="160" y1="280" x2="168" y2="280"/>
    <line x1="160" y1="320" x2="168" y2="320"/><line x1="160" y1="360" x2="168" y2="360"/>
    <line x1="160" y1="400" x2="168" y2="400"/>
  </g>
  <!-- Horizontal base tick marks -->
  <g stroke="rgba(201,162,39,0.3)" stroke-width="0.8" fill="none">
    <line x1="200" y1="430" x2="200" y2="422"/><line x1="240" y1="430" x2="240" y2="422"/>
    <line x1="280" y1="430" x2="280" y2="422"/><line x1="320" y1="430" x2="320" y2="422"/>
    <line x1="360" y1="430" x2="360" y2="422"/><line x1="400" y1="430" x2="400" y2="422"/>
  </g>

  <!-- ===== VERNIER CALIPER ===== -->
  <!-- Main body (two parallel bars) -->
  <!-- Outer bar (longer) -->
  <rect x="470" y="100" width="280" height="18" rx="3"
    fill="url(#st-toolGrad)" stroke="rgba(201,162,39,0.7)" stroke-width="1.5" filter="url(#st-sharpGlow)"/>
  <!-- Top highlight -->
  <line x1="472" y1="102" x2="748" y2="102" stroke="rgba(255,245,180,0.3)" stroke-width="1"/>
  <!-- Inner bar -->
  <rect x="470" y="125" width="280" height="14" rx="2"
    fill="rgba(201,162,39,0.45)" stroke="rgba(201,162,39,0.6)" stroke-width="1.2"/>
  <!-- Sliding scale (vernier) -->
  <rect x="560" y="95" width="60" height="50" rx="2"
    fill="rgba(201,162,39,0.25)" stroke="rgba(201,162,39,0.7)" stroke-width="1.5"/>
  <!-- Scale markings on vernier -->
  <g stroke="rgba(255,245,180,0.7)" stroke-width="0.8" fill="none">
    <line x1="572" y1="95" x2="572" y2="102"/>
    <line x1="578" y1="95" x2="578" y2="100"/>
    <line x1="584" y1="95" x2="584" y2="102"/>
    <line x1="590" y1="95" x2="590" y2="100"/>
    <line x1="596" y1="95" x2="596" y2="102"/>
    <line x1="602" y1="95" x2="602" y2="100"/>
    <line x1="608" y1="95" x2="608" y2="102"/>
    <line x1="614" y1="95" x2="614" y2="100"/>
  </g>
  <!-- Main scale markings on body -->
  <g stroke="rgba(255,245,180,0.5)" stroke-width="0.8" fill="none">
    <line x1="490" y1="100" x2="490" y2="106"/>
    <line x1="505" y1="100" x2="505" y2="104"/>
    <line x1="520" y1="100" x2="520" y2="106"/>
    <line x1="535" y1="100" x2="535" y2="104"/>
    <line x1="550" y1="100" x2="550" y2="106"/>
    <line x1="630" y1="100" x2="630" y2="106"/>
    <line x1="645" y1="100" x2="645" y2="104"/>
    <line x1="660" y1="100" x2="660" y2="106"/>
    <line x1="675" y1="100" x2="675" y2="104"/>
    <line x1="690" y1="100" x2="690" y2="106"/>
    <line x1="705" y1="100" x2="705" y2="104"/>
    <line x1="720" y1="100" x2="720" y2="106"/>
    <line x1="735" y1="100" x2="735" y2="104"/>
  </g>
  <!-- Outer measuring jaws -->
  <g fill="rgba(201,162,39,0.55)" stroke="rgba(201,162,39,0.8)" stroke-width="1.2">
    <!-- Left jaw (fixed) -->
    <rect x="470" y="118" width="16" height="50" rx="2"/>
    <!-- Right jaw (sliding) -->
    <rect x="580" y="118" width="14" height="45" rx="2"/>
  </g>
  <!-- Depth rod -->
  <rect x="745" y="102" width="6" height="80" rx="1" fill="rgba(201,162,39,0.6)" stroke="rgba(201,162,39,0.8)" stroke-width="0.8"/>
  <!-- Lock screw on caliper -->
  <circle cx="590" cy="112" r="5" fill="rgba(201,162,39,0.5)" stroke="rgba(201,162,39,0.7)" stroke-width="1"/>
  <line x1="586" y1="112" x2="594" y2="112" stroke="rgba(255,240,150,0.7)" stroke-width="1"/>
  <line x1="590" y1="108" x2="590" y2="116" stroke="rgba(255,240,150,0.7)" stroke-width="1"/>

  <!-- ===== COMPASS / DIVIDER ===== -->
  <!-- V-shape with pivot at top -->
  <!-- Left arm -->
  <line x1="650" y1="200" x2="600" y2="420"
    stroke="rgba(201,162,39,0.75)" stroke-width="3.5" stroke-linecap="round" filter="url(#st-sharpGlow)"/>
  <!-- Right arm -->
  <line x1="650" y1="200" x2="700" y2="420"
    stroke="rgba(201,162,39,0.75)" stroke-width="3.5" stroke-linecap="round" filter="url(#st-sharpGlow)"/>
  <!-- Arm highlights -->
  <line x1="650" y1="203" x2="601" y2="420" stroke="rgba(255,245,180,0.2)" stroke-width="1"/>
  <line x1="650" y1="203" x2="699" y2="420" stroke="rgba(255,245,180,0.2)" stroke-width="1"/>
  <!-- Pivot joint at top -->
  <circle cx="650" cy="200" r="12" fill="rgba(201,162,39,0.4)" stroke="rgba(201,162,39,0.8)" stroke-width="2"/>
  <circle cx="650" cy="200" r="6" fill="rgba(201,162,39,0.7)" stroke="rgba(255,240,150,0.5)" stroke-width="1"/>
  <circle cx="650" cy="200" r="2.5" fill="rgba(255,240,150,0.9)"/>
  <!-- Adjustment bow (arc connecting arms at midpoint) -->
  <path d="M618,310 Q650,295 682,310" fill="none" stroke="rgba(201,162,39,0.55)" stroke-width="2"/>
  <!-- Adjustment screw on bow -->
  <circle cx="650" cy="302" r="6" fill="rgba(201,162,39,0.45)" stroke="rgba(201,162,39,0.65)" stroke-width="1"/>
  <!-- Point tips (sharp) -->
  <!-- Left tip -->
  <polygon points="596,415 601,425 606,415" fill="rgba(255,245,180,0.7)" stroke="rgba(201,162,39,0.8)" stroke-width="0.8"/>
  <!-- Right tip -->
  <polygon points="694,415 700,425 706,415" fill="rgba(255,245,180,0.7)" stroke="rgba(201,162,39,0.8)" stroke-width="0.8"/>
  <!-- Arc drawn by compass (ghosted arc on the grid) -->
  <path d="M548,420 Q650,310 752,420" fill="none" stroke="rgba(201,162,39,0.2)" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ===== PROTRACTOR ARC (partial) ===== -->
  <!-- Half-circle protractor in lower-left -->
  <path d="M120,450 A130,130 0 0,1 380,450" fill="rgba(201,162,39,0.05)" stroke="rgba(201,162,39,0.5)" stroke-width="1.5"/>
  <path d="M128,450 A122,122 0 0,1 372,450" fill="none" stroke="rgba(201,162,39,0.25)" stroke-width="0.8"/>
  <!-- Protractor tick marks (degree marks) -->
  <g stroke="rgba(201,162,39,0.5)" stroke-width="1" fill="none">
    <!-- 0° -->
    <line x1="120" y1="450" x2="120" y2="438"/>
    <!-- 30° -->
    <line x1="185" y1="337" x2="191" y2="326"/>
    <!-- 60° -->
    <line x1="250" y1="337" x2="244" y2="325"/>
    <!-- 90° (top) -->
    <line x1="250" y1="320" x2="250" y2="308"/>
    <!-- 120° -->
    <line x1="315" y1="337" x2="309" y2="325"/>
    <!-- 150° -->
    <line x1="365" y1="395" x2="371" y2="384"/>
    <!-- 180° -->
    <line x1="380" y1="450" x2="380" y2="438"/>
  </g>
  <!-- Minor ticks every 10° -->
  <g stroke="rgba(201,162,39,0.25)" stroke-width="0.8" fill="none">
    <line x1="131" y1="420" x2="133" y2="412"/>
    <line x1="148" y1="393" x2="152" y2="386"/>
    <line x1="163" y1="365" x2="168" y2="358"/>
    <line x1="207" y1="316" x2="211" y2="309"/>
    <line x1="228" y1="313" x2="231" y2="306"/>
    <line x1="271" y1="313" x2="268" y2="306"/>
    <line x1="293" y1="316" x2="289" y2="309"/>
    <line x1="337" y1="358" x2="332" y2="351"/>
    <line x1="351" y1="385" x2="347" y2="378"/>
    <line x1="369" y1="420" x2="367" y2="412"/>
  </g>
  <!-- Protractor base line -->
  <line x1="120" y1="450" x2="380" y2="450" stroke="rgba(201,162,39,0.5)" stroke-width="1.5"/>
  <!-- Centre dot of protractor -->
  <circle cx="250" cy="450" r="4" fill="rgba(201,162,39,0.6)" stroke="rgba(201,162,39,0.8)" stroke-width="1"/>

  <!-- ===== RULER / STRAIGHT EDGE (diagonal) ===== -->
  <!-- Thin rectangle at a slight angle across the right-centre area -->
  <rect x="460" y="280" width="260" height="22" rx="3"
    fill="rgba(201,162,39,0.1)" stroke="rgba(201,162,39,0.55)" stroke-width="1.2"
    transform="rotate(-12,590,291)"/>
  <!-- Ruler highlight -->
  <line x1="463" y1="282" x2="717" y2="282" stroke="rgba(255,245,180,0.2)" stroke-width="1"
    transform="rotate(-12,590,291)"/>
  <!-- Ruler tick marks -->
  <g stroke="rgba(201,162,39,0.45)" stroke-width="0.8" fill="none" transform="rotate(-12,590,291)">
    <line x1="480" y1="280" x2="480" y2="287"/>
    <line x1="510" y1="280" x2="510" y2="287"/>
    <line x1="540" y1="280" x2="540" y2="287"/>
    <line x1="570" y1="280" x2="570" y2="287"/>
    <line x1="600" y1="280" x2="600" y2="287"/>
    <line x1="630" y1="280" x2="630" y2="287"/>
    <line x1="660" y1="280" x2="660" y2="287"/>
    <line x1="690" y1="280" x2="690" y2="287"/>
  </g>
  <g stroke="rgba(201,162,39,0.25)" stroke-width="0.6" fill="none" transform="rotate(-12,590,291)">
    <line x1="465" y1="280" x2="465" y2="284"/>
    <line x1="495" y1="280" x2="495" y2="284"/>
    <line x1="525" y1="280" x2="525" y2="284"/>
    <line x1="555" y1="280" x2="555" y2="284"/>
    <line x1="585" y1="280" x2="585" y2="284"/>
    <line x1="615" y1="280" x2="615" y2="284"/>
    <line x1="645" y1="280" x2="645" y2="284"/>
    <line x1="675" y1="280" x2="675" y2="284"/>
    <line x1="705" y1="280" x2="705" y2="284"/>
  </g>

  <!-- ===== MEASUREMENT ANNOTATION LINES ===== -->
  <!-- Cross-hairs / dimension lines -->
  <g stroke="rgba(201,162,39,0.25)" stroke-width="0.8" fill="none">
    <!-- Horizontal dim line across caliper -->
    <line x1="470" y1="78" x2="750" y2="78"/>
    <line x1="470" y1="75" x2="470" y2="82"/>

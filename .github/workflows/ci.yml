name: CI/CD Pipeline

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          echo "Checking frontend JS syntax..."
          for f in *.js; do
            node -c "$f" || exit 1
          done
          echo "All frontend files pass syntax check"

      - name: Validate API JS syntax
        working-directory: ./api
        run: |
          for f in *.js; do
            node -c "$f" || exit 1
          done
          echo "All API files pass syntax check"

      - name: Run tests
        run: npx jest tests/ --ci --coverage --forceExit
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          # Check for common secret patterns (excluding config.js which has Supabase anon key)
          FOUND=$(grep -rn "password\s*=\s*['\"]" --include="*.js" --include="*.html" \
            --exclude="config.js" --exclude-dir=node_modules --exclude-dir=.git . || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: Possible hardcoded passwords found:"
            echo "$FOUND"
          fi

      - name: Check for .env files committed
        run: |
          if [ -f .env ] || [ -f api/.env ]; then
            echo "ERROR: .env file should not be committed!"
            exit 1
          fi

      - name: Audit API dependencies
        working-directory: ./api
        run: npm audit --production --audit-level=high || true

  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: npm install

      - name: Bundle JavaScript
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

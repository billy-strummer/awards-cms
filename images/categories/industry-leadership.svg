    <rect x="320" y="240" width="160" height="45" rx="3"/>
    <circle cx="340" cy="195" r="8"/><circle cx="400" cy="170" r="10"/><circle cx="460" cy="195" r="8"/>
  </g>
  <!-- Star burst -->
  <g fill="rgba(201,162,39,0.15)" transform="translate(400,370)">
    <polygon points="0,-50 12,-16 46,-15 19,5 29,42 0,22 -29,42 -19,5 -46,-15 -12,-16"/>
    <polygon points="0,-80 6,-28 50,-25 14,8 24,56 0,36 -24,56 -14,8 -50,-25 -6,-28" fill="none" stroke="rgba(201,162,39,0.18)" stroke-width="1"/>
  </g>
  <!-- Small accent stars -->
  <g fill="rgba(201,162,39,0.2)">
    <polygon points="160,150 165,165 180,165 168,174 172,190 160,181 148,190 152,174 140,165 155,165" transform="scale(0.7) translate(75,80)"/>
    <polygon points="640,120 645,135 660,135 648,144 652,160 640,151 628,160 632,144 620,135 635,135" transform="scale(0.6) translate(420,40)"/>
